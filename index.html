function renderAdmin(){
  const valid = state.validIds || {};
  const validIdList = Object.keys(valid).sort();
  const registeredIds = new Set(Object.values(state.profiles).filter(p => p.role !== 'admin').map(p => p.idCard));

  const rows = validIdList.length === 0
    ? `<div class="empty-state">Abhi whitelist khaali hai. Neeche se ID numbers add karein.</div>`
    : validIdList.map(id => {
        const used = registeredIds.has(id);
        const rec = valid[id] || {};
        return `
        <div class="user-row">
          <div class="user-row-info">
            <div class="user-row-name">${esc(id)}</div>
            <div class="user-row-meta">Class ${esc(rec.class || '—')} · Sec ${esc(rec.section || '—')}${rec.passYear ? ` · Pass ${esc(String(rec.passYear))}` : ''} · ${used ? 'Student ne account bana liya hai' : 'Abhi tak koi account nahi bana'}</div>
          </div>
          <span class="whitelist-badge ${used?'used':'free'}">${used?'Registered':'Free'}</span>
          <button type="button" class="block-btn" data-act="remove-valid-id" data-id="${esc(id)}">${svgIcon('x')} Hataayein</button>
        </div>`;
      }).join('');

  return `
    <div class="card" style="margin-bottom:14px">
      <div class="profile-note">Pre-approved serial number list</div>
      <div class="verify-hint" style="margin-bottom:12px">Only serial numbers added here can register — anyone else trying to sign up will be blocked. Class/Course is chosen by the student themself; the fields below are just for your own record.</div>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${validIdList.length}</div><div class="stat-label">Whitelist mein</div></div>
        <div class="stat-box"><div class="stat-num">${validIdList.filter(id=>registeredIds.has(id)).length}</div><div class="stat-label">Registered</div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="profile-note">Ek ID number add karein</div>
      <div class="field">
        <label>Serial Number</label>
        <input id="admin-add-id" placeholder="jaise: 11851" value="${esc(state.adminAddId)}" />
      </div>
      <div class="row2">
        <div class="field">
          <label>Class / Course (optional)</label>
          <input id="admin-add-class" placeholder="jaise: 12 ya BA" value="${esc(state.adminAddClass)}" />
        </div>
        <div class="field">
          <label>Section (optional)</label>
          <input id="admin-add-section" placeholder="jaise: A" value="${esc(state.adminAddSection)}" />
        </div>
      </div>
      <div class="field">
        <label>Passing Year (optional)</label>
        <input id="admin-add-passyear" placeholder="jaise: 2028" value="${esc(state.adminAddPassYear)}" />
      </div>
      ${state.adminError ? `<div class="error-note">${esc(state.adminError)}</div>` : ''}
      <button type="button" class="btn-primary" data-act="admin-add-id" ${state.adminBusy?'disabled':''}>${svgIcon('check')} ${state.adminBusy?'Add ho raha hai…':'Add karein'}</button>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="profile-note">Ek saath bahut se number add karein</div>
      <div class="field">
        <label>Har line mein: ID,Class,Section,PassingYear</label>
        <textarea id="admin-bulk-ids" rows="5" placeholder="11851,10,A&#10;11852,BA,&#10;11853,12,A,2028">${esc(state.adminBulkIds)}</textarea>
        <div class="verify-hint" style="margin-top:6px">Format: ek line mein ek entry — <code>ID,Class,Section,PassingYear</code>. Class/Section/PassingYear sabhi optional hain, sirf record ke liye.</div>
      </div>
      <button type="button" class="btn-primary" data-act="admin-bulk-add" ${state.adminBusy?'disabled':''}>${svgIcon('check')} ${state.adminBusy?'Add ho raha hai…':'Sabko add karein'}</button>
    </div>

    <div class="admin-section-title" style="font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;">Whitelist</div>
    ${rows}
  `;
}

/* ================= events ================= */
function bindEvents(){
  const on = (sel, ev, fn) => { const el = root.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  const onAll = (sel, ev, fn) => root.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));

  if (!state.session && state.introStep){
    on('#intro-agree-checkbox', 'change', e => { state.introChecked = e.target.checked; render(); });
    on('[data-act="intro-next"]', 'click', () => {
      if (!state.introChecked) return;
      state.introStep = 'about'; state.introChecked = false; render();
    });
    on('[data-act="intro-back"]', 'click', () => { state.introStep = 'terms'; state.introChecked = true; render(); });
    on('[data-act="intro-done"]', 'click', () => {
      if (!state.introChecked) return;
      state.introStep = null;
      try { sessionStorage.setItem('fc_intro_seen', '1'); } catch(e){}
      render();
    });
    return;
  }

  if (!state.session){
    on('[data-act="mode-login"]', 'click', () => { state.authMode='login'; state.authError=''; render(); });
    on('[data-act="mode-create"]', 'click', () => { state.authMode='create'; state.authError=''; render(); });

    on('#login-id', 'input', e => state.authForm.idCard = e.target.value);
    on('#login-password', 'input', e => state.authForm.password = e.target.value);
    on('[data-act="login"]', 'click', handleLogin);

    on('[data-act="role-student"]', 'click', () => { state.authForm.role='student'; state.authError=''; render(); });
    on('[data-act="role-admin"]', 'click', () => { state.authForm.role='admin'; state.authError=''; render(); });

    on('#create-id', 'input', e => { state.authForm.idCard = e.target.value; });
    on('#create-password', 'input', e => { state.authForm.password = e.target.value; });
    on('#create-name', 'input', e => { state.authForm.name = e.target.value; });
    on('#create-subject', 'input', e => { state.authForm.subject = e.target.value; });
    on('#create-class', 'change', e => { state.authForm.klass = e.target.value; });
    on('#create-admincode', 'input', e => { state.authForm.adminCode = e.target.value; });
    on('[data-act="pick-photo"]', 'click', () => root.querySelector('#create-photo-input').click());
    on('#create-photo-input', 'change', async e => {
      const file = e.target.files[0]; if (!file) return;
      state.authForm.photo = await resizeImage(file); // login se pehle koi session/uid nahi hota, isliye upload nahi ho sakta — turant preview ke liye base64 hi rakhte hain; account banate hi ye Storage par upload ho jaayegi (handleCreate mein)
      render();
    });
    on('[data-act="create"]', 'click', handleCreate);
    return;
  }

  on('[data-act="logout"]', 'click', async () => {
    if (state.timer.running) pauseTimer();
    if (state.stopwatch.running) pauseStopwatch();
    state.profileEdit=null; state.profileNameError=''; state.viewingProfile=null; state.viewingFollowList=null; state.chatWith=null; state.chatList=[]; state.searchQuery=''; state.settingsOpen=false;
    try { await auth.signOut(); } catch(e){}
  });
  on('[data-act="toggle-theme"]', 'click', toggleTheme);
  onAll('[data-act="load-image"]', 'click', e => {
    e.preventDefault(); e.stopPropagation();
    state.loadedImages.add(e.currentTarget.dataset.url);
    render();
  });
  // Tools tab se bahar jaate waqt study timer/stopwatch ko background mein
  // chalte rehne dene ki zaroorat nahi — pause kar dete hain taaki har
  // second ki re-render dusre tabs mein waste na ho.
  const leaveTools = () => {
    if (state.tab === 'tools' && state.timer.running) pauseTimer();
    if (state.tab === 'tools' && state.stopwatch.running) pauseStopwatch();
  };
  on('[data-act="tab-home"]', 'click', () => { leaveTools(); state.tab='home'; state.viewingProfile=null; state.viewingFollowList=null; state.chatWith=null; render(); fetchFeed(); });
  on('[data-act="tab-search"]', 'click', () => { leaveTools(); state.tab='search'; state.viewingProfile=null; state.viewingFollowList=null; state.chatWith=null; render(); fetchProfiles(); });
  on('[data-act="tab-tools"]', 'click', () => { state.tab='tools'; state.viewingProfile=null; state.viewingFollowList=null; state.chatWith=null; render(); });
  on('[data-act="tab-chat"]', 'click', () => { leaveTools(); state.tab='chat'; state.viewingProfile=null; state.viewingFollowList=null; state.chatWith=null; render(); subscribeChatList(); fetchProfiles(); });
  on('[data-act="tab-profile"]', 'click', () => { leaveTools(); state.tab='profile'; state.viewingProfile=null; state.viewingFollowList=null; state.chatWith=null; render(); });
  on('[data-act="tab-admin"]', 'click', () => { leaveTools(); state.tab='admin'; state.viewingProfile=null; state.viewingFollowList=null; state.chatWith=null; render(); fetchValidIds(); });

  if (state.chatWith){
    on('[data-act="close-chat"]', 'click', () => {
      if (unsubChatMsgs) { unsubChatMsgs(); unsubChatMsgs = null; }
      state.chatWith=null; state.chatMessages=[]; render(); subscribeChatList();
    });
    on('#chat-text-input', 'input', e => state.chatText = e.target.value);
    on('[data-act="send-chat"]', 'click', handleSendChat);
    onAll('[data-act="delete-message"]', 'click', e => { e.stopPropagation(); handleDeleteMessage(e.currentTarget.dataset.id); });
    on('[data-act="pick-chat-file"]', 'click', () => root.querySelector('#chat-file-input').click());
    on('#chat-file-input', 'change', async e => {
      const file = e.target.files[0]; if (!file) return;
      e.target.value = '';
      await handleSendChatFile(file);
    });
    return;
  }
  if (state.viewingFollowList){
    on('[data-act="close-follow-list"]', 'click', () => { state.viewingFollowList=null; render(); });
    onAll('[data-act="toggle-follow"]', 'click', e => handleToggleFollow(e.currentTarget.dataset.id));
    onAll('[data-act="open-profile"]', 'click', e => { state.viewingFollowList=null; state.viewingProfile = e.currentTarget.dataset.id; render(); });
    return;
  }
  if (state.viewingProfile){
    on('[data-act="close-profile"]', 'click', () => { state.viewingProfile=null; render(); });
    onAll('[data-act="toggle-follow"]', 'click', e => handleToggleFollow(e.currentTarget.dataset.id));
    onAll('[data-act="toggle-block"]', 'click', e => handleToggleBlock(e.currentTarget.dataset.id));
    onAll('[data-act="open-chat"]', 'click', e => openChat(e.currentTarget.dataset.id));
    onAll('[data-act="open-follow-list"]', 'click', e => { state.viewingFollowList = { idCard: e.currentTarget.dataset.id, type: e.currentTarget.dataset.type }; render(); });
    return;
  }

  if (state.tab === 'home'){
    on('#composer-text', 'input', e => state.composer.text = e.target.value);
    on('[data-act="pick-post-photo"]', 'click', () => root.querySelector('#post-photo-input').click());
    on('#post-photo-input', 'change', async e => {
      const file = e.target.files[0]; if (!file) return;
      state.composer.image = await resizeImage(file, 480);
      render();
    });
    on('[data-act="clear-image"]', 'click', () => { state.composer.image=''; render(); });
    on('[data-act="post"]', 'click', handlePost);
    onAll('[data-act="filter"]', 'click', e => { state.sectionFilter = e.currentTarget.dataset.val; render(); });
    onAll('[data-act="like"]', 'click', e => handleLike(e.currentTarget.dataset.id));
    onAll('[data-act="delete-post"]', 'click', e => handleDeletePost(e.currentTarget.dataset.id));
    onAll('[data-act="open-profile"]', 'click', e => { state.viewingProfile = e.currentTarget.dataset.id; render(); });
  } else if (state.tab === 'search'){
    on('#search-input', 'input', e => { state.searchQuery = e.target.value; render(); });
    onAll('[data-act="open-profile"]', 'click', e => { state.viewingProfile = e.currentTarget.dataset.id; render(); });
    onAll('[data-act="toggle-follow"]', 'click', e => handleToggleFollow(e.currentTarget.dataset.id));
  } else if (state.tab === 'tools'){
    onAll('[data-act="tool-tab"]', 'click', e => {
      if (state.timer.running) pauseTimer();
      if (state.stopwatch.running) pauseStopwatch();
      state.toolTab = e.currentTarget.dataset.val; render();
    });
    // calculator
    onAll('[data-act="calc-mode"]', 'click', e => { state.calc.mode = e.currentTarget.dataset.val; render(); });
    on('#calc-obtained', 'input', e => { state.calc.obtained = e.target.value; render(); });
    on('#calc-total', 'input', e => { state.calc.total = e.target.value; render(); });
    on('#calc-cgpa', 'input', e => { state.calc.cgpa = e.target.value; render(); });
    on('#calc-percent', 'input', e => { state.calc.percentInput = e.target.value; render(); });
    // study timer
    on('[data-act="start-timer"]', 'click', startTimer);
    on('[data-act="pause-timer"]', 'click', pauseTimer);
    on('[data-act="reset-timer"]', 'click', resetTimer);
    // exam countdown
    on('#cd-name', 'input', e => { state.countdown.name = e.target.value; saveCountdown(); });
    on('#cd-date', 'input', e => { state.countdown.date = e.target.value; saveCountdown(); render(); });
    // ID QR code
    if (state.toolTab === 'qr') renderIdQr();
    // personal notes
    on('#note-input', 'input', e => { state.noteInput = e.target.value; });
    on('[data-act="note-add"]', 'click', addNote);
    onAll('[data-act="note-toggle"]', 'click', e => toggleNote(Number(e.currentTarget.dataset.id)));
    onAll('[data-act="note-delete"]', 'click', e => deleteNote(Number(e.currentTarget.dataset.id)));
    on('#flashcard-q', 'input', e => { state.flashcardForm.q = e.target.value; });
    on('#flashcard-a', 'input', e => { state.flashcardForm.a = e.target.value; });
    on('[data-act="flashcard-add"]', 'click', addFlashcard);
    on('[data-act="flashcard-flip"]', 'click', () => { state.flashcardFlipped = !state.flashcardFlipped; render(); });
    on('[data-act="flashcard-prev"]', 'click', () => navFlashcard(-1));
    on('[data-act="flashcard-next"]', 'click', () => navFlashcard(1));
    onAll('[data-act="flashcard-delete"]', 'click', e => deleteFlashcard(Number(e.currentTarget.dataset.id)));
    // unit converter

    on('#uc-val', 'input', e => { state.unitConv.val = e.target.value; render(); });
    on('#uc-from', 'change', e => { state.unitConv.from = e.target.value; render(); });
    on('#uc-to', 'change', e => { state.unitConv.to = e.target.value; render(); });
    on('[data-act="uc-swap"]', 'click', () => { const c = state.unitConv; const f = c.from; c.from = c.to; c.to = f; render(); });
    // periodic table
    on('#periodic-search', 'input', e => { state.periodicSearch = e.target.value; render(); });
    onAll('[data-act="periodic-pick"]', 'click', e => {
      const id = Number(e.currentTarget.dataset.id);
      state.periodicSelected = state.periodicSelected === id ? null : id;
      render();
    });
    // formula sheet
    onAll('[data-act="formula-subject"]', 'click', e => { state.formulaSubject = e.currentTarget.dataset.val; render(); });
    // weekly timetable
    onAll('[data-act="tt-day"]', 'click', e => { state.timetableDay = e.currentTarget.dataset.val; render(); });
    on('#tt-time', 'input', e => { state.ttForm.time = e.target.value; });
    on('#tt-subject', 'input', e => { state.ttForm.subject = e.target.value; });
    on('[data-act="tt-add"]', 'click', addTimetableEntry);
    onAll('[data-act="tt-delete"]', 'click', e => deleteTimetableEntry(e.currentTarget.dataset.day, Number(e.currentTarget.dataset.id)));
    // study checklist
    on('#checklist-input', 'input', e => { state.checklistInput = e.target.value; });
    on('[data-act="checklist-add"]', 'click', addChecklistItem);
    onAll('[data-act="checklist-toggle"]', 'click', e => toggleChecklistItem(Number(e.currentTarget.dataset.id)));
    onAll('[data-act="checklist-delete"]', 'click', e => deleteChecklistItem(Number(e.currentTarget.dataset.id)));
    // word/character counter
    on('#wc-text', 'input', e => { state.wordCounterText = e.target.value; render(); });
    // age calculator
    on('#age-dob', 'input', e => { state.ageDob = e.target.value; render(); });
    // random group/name picker
    onAll('[data-act="picker-mode"]', 'click', e => { state.pickerMode = e.currentTarget.dataset.val; state.pickerResult = null; render(); });
    on('#picker-names', 'input', e => { state.groupNamesInput = e.target.value; });
    on('#picker-size', 'input', e => { state.groupSize = e.target.value; });
    on('[data-act="picker-run"]', 'click', runPicker);

    on('#typing-input', 'input', e => {

      if (t.status === 'idle') { t.status = 'running'; t.startTime = Date.now(); }

      render();
    });
    on('[data-act="typing-finish"]', 'click', finishTypingTest);
    on('[data-act="typing-reset"]', 'click', newTypingTest);
    // simple stopwatch
    on('[data-act="start-stopwatch"]', 'click', startStopwatch);
    on('[data-act="pause-stopwatch"]', 'click', pauseStopwatch);
    on('[data-act="reset-stopwatch"]', 'click', resetStopwatch);
    on('[data-act="lap-stopwatch"]', 'click', lapStopwatch);
  } else if (state.tab === 'chat'){
    onAll('[data-act="open-chat"]', 'click', e => openChat(e.currentTarget.dataset.id));
    onAll('[data-act="delete-chat"]', 'click', e => { e.stopPropagation(); handleDeleteChat(e.currentTarget.dataset.id); });
    on('#chat-search-input', 'input', e => { state.chatSearchQuery = e.target.value; render(); });
  } else if (state.tab === 'admin'){
    on('#admin-add-id', 'input', e => state.adminAddId = e.target.value);
    on('#admin-add-class', 'input', e => state.adminAddClass = e.target.value);
    on('#admin-add-section', 'input', e => state.adminAddSection = e.target.value);
    on('#admin-add-passyear', 'input', e => state.adminAddPassYear = e.target.value);
    on('#admin-bulk-ids', 'input', e => state.adminBulkIds = e.target.value);

    on('[data-act="admin-bulk-add"]', 'click', handleAdminBulkAdd);
    onAll('[data-act="remove-valid-id"]', 'click', e => handleAdminRemoveId(e.currentTarget.dataset.id));
  } else {
    onAll('[data-act="accept-follow-request"]', 'click', e => handleAcceptFollowRequest(e.currentTarget.dataset.id));
    onAll('[data-act="decline-follow-request"]', 'click', e => handleDeclineFollowRequest(e.currentTarget.dataset.id));
    on('#profile-name', 'input', e => state.profileEdit.name = e.target.value);
    on('#hide-online-toggle', 'change', e => handleToggleHideOnline(e.target.checked));
    on('#private-account-toggle', 'change', e => handleTogglePrivateAccount(e.target.checked));
    on('#hide-preview-toggle', 'change', e => { state.hidePreview = e.target.checked; localStorage.setItem('fc_hide_preview', e.target.checked ? '1' : '0'); render(); });
    on('#data-saver-toggle', 'change', e => { state.dataSaver = e.target.checked; localStorage.setItem('fc_data_saver', e.target.checked ? '1' : '0'); render(); });
    on('#font-size-select', 'change', e => { state.fontSize = e.target.value; localStorage.setItem('fc_font_size', e.target.value); applyFontSize(); render(); });
    on('[data-act="toggle-settings-panel"]', 'click', () => { state.settingsOpen = !state.settingsOpen; render(); });
    on('[data-act="pick-profile-photo"]', 'click', () => root.querySelector('#profile-photo-input').click());

    on('[data-act="save-profile"]', 'click', handleSaveProfile);

    on('#pw-current', 'input', e => { state.passwordChange.current = e.target.value; state.passwordChange.error=''; state.passwordChange.success=false; });
    on('#pw-next', 'input', e => { state.passwordChange.next = e.target.value; state.passwordChange.error=''; state.passwordChange.success=false; });
    on('[data-act="change-password"]', 'click', handleChangePassword);
  }
}

async function handleLogin(){
  const id = (state.authForm.idCard || '').trim().toUpperCase();
  const password = state.authForm.password || '';
  state.authError = '';
  if (!id) { state.authError = 'Please enter your ID card number.'; return render(); }
  if (!parseIdCard(id)) { state.authError = 'ID card number is invalid. Enter your serial number (numbers only, e.g. 11851).'; return render(); }
  if (!password) { state.authError = 'Please enter your password.'; return render(); }
  state.authBusy = true; render();
  try {
    await withTimeout(auth.signInWithEmailAndPassword(emailForId(id), password), 15000);
    /* onAuthStateChanged session set karega aur data load karega */
  } catch(e){
    state.authError = firebaseErrorMessage(e);
  }
  state.authBusy = false;
  render();
}

async function handleCreate(){
  const f = state.authForm;
  const id = (f.idCard || '').trim().toUpperCase();
  const password = f.password || '';
  const isAdmin = f.role === 'admin';
  state.authError = '';

  if (!id) { state.authError = 'Please enter your ID card number.'; return render(); }
  const parsedId = parseIdCard(id);
  if (!parsedId) { state.authError = 'ID card number is invalid. Enter your serial number (numbers only, e.g. 11851).'; return render(); }
  if (!password || password.length < 6) { state.authError = 'Password must be at least 6 characters long.'; return render(); }
  if (!f.name.trim()) { state.authError = 'Please enter your name.'; return render(); }
  if (!isAdmin && !(f.klass || '').trim()) { state.authError = 'Please select your Class / Course.'; return render(); }
  if (!f.subject.trim()) { state.authError = isAdmin ? 'Please enter your designation/subject.' : 'Please enter your subject.'; return render(); }
  if (isAdmin && (f.adminCode || '').trim() !== ADMIN_CODE) { state.authError = 'Incorrect admin passcode.'; return render(); }

  state.authBusy = true; render();
  signupInFlight = true;
  try {
    /* Admin approval gate: student sirf tabhi register kar sakta hai jab
       uska serial number admin ne pehle 'validIds' whitelist mein add
       kiya ho. Class/Course student khud dropdown se choose karta hai —
       whitelist sirf ye check karta hai ki serial number allowed hai ya nahi. */
    const studentClass = isAdmin ? '' : (f.klass || '').trim();
    const studentSection = '';
    const studentPassYear = null;
    if (!isAdmin){
      const validDoc = await withStep('validIds-read', () => withTimeout(db.collection('validIds').doc(id).get(), 15000));
      if (!validDoc.exists) {
        state.authError = 'This serial number has not been added by the admin yet. Please contact the admin to add it first, then try again.';
        state.authBusy = false;
        return render();
      }
    }

    const cred = await withStep('auth-create', () => withTimeout(auth.createUserWithEmailAndPassword(emailForId(id), password), 15000));

    try {
      /* Naya account banne ke turant baad, agla koi bhi Firestore call
         (jaise neeche wala users-count check) kabhi-kabhi "permission-denied"
         de sakta hai — kyunki naye account ka login-token Firestore tak
         pahunchne mein ek pal ki der lag sakti hai. Isse ek adhoora/orphan
         account ban jaata, jisme login ho jaata hai (kyunki account bana
         hi tha) lekin profile kabhi nahi banti, aur wo ID card hamesha ke
         liye atak jaata. Isse rokne ke liye, pehle token ko explicitly
         refresh karke pakka karte hain ki wo Firestore ke liye taiyar hai. */
      await withStep('token-refresh', () => withTimeout(cred.user.getIdToken(true), 15000));

      /* ===== Total user cap check =====
         'profiles' collection sirf logged-in user hi read kar sakta hai
         (Firestore Rules), isliye yeh check bhi Auth account banne ke
         BAAD hi ho sakta hai — bilkul naam-duplicate check jaisa pattern.
         Poori collection ka count liya jaata hai (student + admin dono
         milakar); fetchProfiles bhi waise hi poori collection fetch
         karta hai, isliye yeh ek extra read school-scale app ke liye
         theek hai. Limit poori mile to abhi-abhi bana Auth account turant
         delete kar dete hain, taaki koi orphan/adhoora account na bache. */
      const profilesSnap = await withStep('user-cap-check', () => withAuthRetry(() => withTimeout(db.collection('profiles').get(), 15000)));
      if (profilesSnap.size >= MAX_TOTAL_USERS) {
        state.authError = `SeniorCircle's registration limit (${MAX_TOTAL_USERS} users) has been reached. New accounts cannot be created right now — please contact an admin.`;
        try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
        state.authBusy = false;
        return render();
      }

      /* Naam sign-in hone ke baad hi check ho sakta hai (Firestore Rules
         mein profiles read sirf logged-in user ke liye allowed hai) —
         isliye yeh check auth account banne ke turant baad, profile
         Firestore mein save hone se PEHLE karte hain. Agar naam pehle se
         kisi ka hai, to abhi-abhi bana auth account bhi turant delete
         kar dete hain, taaki koi orphan/adhoora account na bache. */
      const nameTaken = await withStep('name-check', () => nameAlreadyTaken(f.name.trim(), id, true));
      if (nameTaken) {
        state.authError = 'This name is already in use in another (student or admin) profile. Please try a slightly different name (e.g. add a surname/middle name).';
        try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
        state.authBusy = false;
        return render();
      }

      /* Agar isi ID card number ki koi PURANI profile document pehle se
         Firestore mein maujood hai (jaise koi purana student jiska ID
         admin ne whitelist se hata diya tha lekin uski profile clean
         hone se pehle hi kisi ne dobara register karne ki koshish ki),
         to abhi hi rok dete hain — warna aage wala .set() Firestore ko
         "create" ki jagah "update" lagega (kyunki doc pehle se hai) aur
         confusing "Firestore permission error" dega. Yahan clear
         Hindi/Urdu message dete hain taaki student admin se sampark
         kar sake. */
      const existingProfile = await withStep('existing-profile-check', () => withAuthRetry(() => withTimeout(db.collection('profiles').doc(id).get(), 15000)));
      if (existingProfile.exists) {
        state.authError = 'An old profile record for this ID card number already exists. Please contact an admin so they can clear the old record and let you register again.';
        try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
        state.authBusy = false;
        return render();
      }

      const photoUrl = await withTimeout(uploadDataUrl(f.photo, 'profile-photos', cred.user.uid), 20000).catch(() => '');
      const newProfile = isAdmin
        ? { idCard:id, uid: cred.user.uid, name:f.name.trim(), photo:photoUrl, class:'Admin', section:'', subject:f.subject.trim(), role:'admin', following:[], followers:[], blocked:[], followRequests:[], verified:true, verificationRequested:false, marksheetPercent:null, marksheetPhoto:'' }
        : { idCard:id, uid: cred.user.uid, name:f.name.trim(), photo:photoUrl, class:studentClass, section:studentSection, passYear:studentPassYear, subject:f.subject.trim(), role:'student', following:[], followers:[], blocked:[], followRequests:[], verified:false, verificationRequested:false, marksheetPercent:null, marksheetPhoto:'' };
      /* Admin account ke liye: asli passcode-check ab Firestore Rules ke
         andar, server par hota hai (adminCodeMatches()) — client wala
         upar ka check (line ~2632) sirf turant UX feedback ke liye hai.
         Isliye profile create karne se PEHLE, type kiya hua passcode
         'adminRequests/{uid}' mein daalte hain (sirf apne hi uid ke
         document mein, koi aur padh nahi sakta), taaki rule usse
         'config/secrets' ke asli passcode se compare kar sake. */
      if (isAdmin) {
        await withStep('admin-passcode-submit', () => withTimeout(db.collection('adminRequests').doc(cred.user.uid).set({ code: (f.adminCode || '').trim() }), 15000));
      }
      try {
        await withStep('profile-create', () => withAuthRetry(() => withTimeout(db.collection('profiles').doc(id).set(newProfile), 15000)));
      } finally {
        /* Passcode-guess sirf temporary tha — ab ise turant saaf kar
           dete hain, chahe profile create safal hua ho ya fail. */
        if (isAdmin) { try { await db.collection('adminRequests').doc(cred.user.uid).delete(); } catch(cleanupErr){} }
      }
      /* onAuthStateChanged session set karega aur data load karega */
    } catch(innerErr){
      /* Account bana chuka tha lekin profile complete hone se pehle kuch
         fail ho gaya (jaise permission-denied ka timing-glitch) — is
         adhoore account ko turant delete kar dete hain, taaki yeh ID
         card kabhi "stuck" na ho aur student turant dobara try kar sake. */
      if (isAdmin) { try { await db.collection('adminRequests').doc(cred.user.uid).delete(); } catch(cleanupErr){} }
      try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
      throw innerErr;
    }
  } catch(e){
    state.authError = firebaseErrorMessage(e);
  } finally {
    /* Chahe signup safal ho, fail ho, ya beech mein kisi wajah se rok
       diya gaya ho — is flag ko hamesha yahan reset karte hain, taaki
       fetchProfiles() ka "account nahi mila" wala auto-signout logic
       agli baar (agla login/signup attempt) normally kaam kare. */
    signupInFlight = false;
    /* Upar guard ki wajah se onAuthStateChanged wala fetchProfiles()
       call signup ke dauraan skip ho gaya tha — ab signup poora ho
       chuka hai (safal ho ya fail), ek fresh fetchProfiles() chala
       dete hain taaki naya profile turant load ho jaaye. */
    if (auth.currentUser) fetchProfiles();
  }
  state.authBusy = false;
  render();
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

/* Har student ke liye roz ka ek limit — taaki koi ek user bahut zyada
   posts ya chat photo/PDF bhej kar Cloudinary/Firestore ka free quota
   akela hi khatam na kar de. Admin/staff par ye limit nahi lagti.
   Count khud us student ki apni profile document mein save hota hai
   (usage.date/usage.posts/usage.postPhotos/usage.chatPhotos/
   usage.chatPdfs) — security rules ke mutabik student apni hi profile
   ke non-verified fields khud badal sakta hai, isliye koi rule change
   karne ki zarurat nahi padi. runTransaction use kiya hai taaki
   double-tap se count galat na ho. */
async function checkAndBumpUsage(kind, limit){
  const me = state.profiles[state.session];
  if (me && me.role === 'admin') return { allowed: true };
  const ref = db.collection('profiles').doc(state.session);
  const today = todayStr();
  try {
    let result;
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      const data = snap.data() || {};
      const blank = { date: today, posts: 0, postPhotos: 0, chatPhotos: 0, chatPdfs: 0 };
      let usage = data.usage || blank;
      if (usage.date !== today) usage = { ...blank };
      const current = usage[kind] || 0;
      if (current >= limit) { result = { allowed: false, count: current }; return; }
      usage[kind] = current + 1;
      tx.update(ref, { usage });
      result = { allowed: true, count: usage[kind] };
    });
    return result;
  } catch(e){
    /* Agar limit-check khud fail ho jaaye (network waghera), post/message
       ko block nahi karte — behtar hai ek extra post jaane dena bajaye
       poori feature ko todne ke. */
    return { allowed: true };
  }
}

const DAILY_POST_LIMIT = 5;
const DAILY_POST_PHOTO_LIMIT = 1;
const DAILY_CHAT_PHOTO_LIMIT = 5;
const DAILY_CHAT_PDF_LIMIT = 5;

async function handlePost(){
  const c = state.composer;
  if (!c.text.trim() && !c.image) return;
  c.error = '';
  if (c.image){
    const photoCheck = await checkAndBumpUsage('postPhotos', DAILY_POST_PHOTO_LIMIT);
    if (!photoCheck.allowed){
      c.error = `Today's photo upload limit (${DAILY_POST_PHOTO_LIMIT}) has been reached. Post with text only, or try again tomorrow with a photo.`;
      return render();
    }
  }
  const usageCheck = await checkAndBumpUsage('posts', DAILY_POST_LIMIT);
  if (!usageCheck.allowed){
    c.error = `Today's post limit (${DAILY_POST_LIMIT}) has been reached. Try again tomorrow.`;
    return render();
  }
  const profile = state.profiles[state.session];
  let imageUrl = '';
  try { imageUrl = await uploadDataUrl(c.image, 'post-images'); } catch(e){ imageUrl = ''; }
  const newPost = {
    idCard: profile.idCard, name: profile.name, photo: profile.photo,
    class: profile.class, section: profile.section,
    text: c.text.trim(), image: imageUrl, time: Date.now(), likes: [],
  };
  try {
    const ref = await db.collection('posts').add(newPost);
    state.feed.unshift({ ...newPost, id: ref.id });
  } catch(e){}
  state.composer = { text:'', image:'', error:'' };
  render();
}

async function handleLike(postId){
  const post = state.feed.find(p => p.id === postId);
  if (!post) return;
  const liked = (post.likes || []).includes(state.session);
  post.likes = liked ? (post.likes || []).filter(x => x !== state.session) : [...(post.likes || []), state.session];
  render();
  try {
    await db.collection('posts').doc(postId).update({
      likes: liked ? firebase.firestore.FieldValue.arrayRemove(state.session) : firebase.firestore.FieldValue.arrayUnion(state.session)
    });
  } catch(e){}
}

async function handleDeletePost(postId){
  const post = state.feed.find(p => p.id === postId);
  if (!post) return;
  if (!confirm('Do you want to delete this post?')) return;
  const idx = state.feed.indexOf(post);
  state.feed.splice(idx, 1);
  render();
  try {
    await db.collection('posts').doc(postId).delete();
  } catch(e){
    state.feed.splice(idx, 0, post);
    render();
  }
}

async function handleDeleteMessage(messageId){
  if (!messageId || !state.chatWith) return;
  if (!confirm('Do you want to delete this message?')) return;
  const idx = state.chatMessages.findIndex(m => m.id === messageId);
  const removed = idx > -1 ? state.chatMessages[idx] : null;
  if (idx > -1) { state.chatMessages.splice(idx, 1); render(); }
  try {
    const chatId = chatKey(state.session, state.chatWith);
    await db.collection('chats').doc(chatId).collection('messages').doc(messageId).delete();
  } catch(e){
    if (removed) { state.chatMessages.splice(idx, 0, removed); render(); }
  }
}

async function handleDeleteChat(otherId){
  if (!otherId) return;
  if (!confirm('Do you want to delete this entire chat?')) return;
  const idx = state.chatList.findIndex(c => c.otherId === otherId);
  const removed = idx > -1 ? state.chatList[idx] : null;
  if (idx > -1) state.chatList.splice(idx, 1);
  render();
  try {
    const chatId = chatKey(state.session, otherId);
    const msgsSnap = await db.collection('chats').doc(chatId).collection('messages').get();
    const batch = db.batch();
    msgsSnap.docs.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection('chats').doc(chatId));
    await batch.commit();
  } catch(e){
    if (removed) { state.chatList.splice(idx, 0, removed); render(); }
  }
}

async function handleSaveProfile(){
  const profile = state.profiles[state.session];
  const e = state.profileEdit;
  const photoUrl = await uploadDataUrl(e.photo, 'profile-photos').catch(() => profile.photo || '');

  /* Naam sirf mahine mein ek baar badal sakta hai (student ho ya admin,
     dono ke liye). Agar cooldown chal raha hai to naam purana hi rehta
     hai — baaki (photo) normally save ho jaata hai. Naya naam
     poori website par kisi aur ke profile mein already use nahi hona
     chahiye — dono students aur admin ke naam is check mein aate hain. */
  const requestedName = e.name.trim() || profile.name;
  const nameChanged = requestedName !== profile.name;
  const stillLocked = nameChangeDaysLeft(profile) > 0;
  state.profileNameError = '';
  let nameUpdate = {};
  if (nameChanged && !stillLocked) {
    const taken = await nameAlreadyTaken(requestedName, state.session);
    if (taken) {
      state.profileNameError = 'This name is already in use in another (student or admin) profile — please try a different name.';
    } else {
      nameUpdate = { name: requestedName, lastNameChangeAt: Date.now() };
    }
  }

  const updated = {
    ...nameUpdate,
    photo: photoUrl,
  };
  try { await db.collection('profiles').doc(state.session).update(updated); state.profiles[state.session] = { ...profile, ...updated }; } catch(e){}
  if (!state.profileNameError) state.profileEdit = null;
  state.profileSaved = true;
  render();
  setTimeout(() => { state.profileSaved = false; render(); }, 1800);
}

async function handleChangePassword(){
  const pc = state.passwordChange;
  pc.error = ''; pc.success = false;
  if (!pc.current) { pc.error = 'Please enter your current password.'; return render(); }
  if (!pc.next || pc.next.length < 6) { pc.error = 'New password must be at least 6 characters long.'; return render(); }
  pc.busy = true; render();
  try {
    const user = auth.currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, pc.current);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(pc.next);
    state.passwordChange = { current:'', next:'', error:'', busy:false, success:true };
  } catch(e){
    pc.busy = false;
    pc.error = firebaseErrorMessage(e);
  }
  render();
}

async function handleToggleFollow(targetId){
  const me = state.profiles[state.session];
  const target = state.profiles[targetId];
  if (!me || !target) return;
  const nowFollowing = (me.following || []).includes(targetId);

  /* Private account: seedha follow nahi hota — pehle ek "follow request"
     jaati hai, jo account ka owner accept/decline karega (jaise Instagram). */
  if (!nowFollowing && target.privateAccount){
    const alreadyRequested = (target.followRequests || []).includes(state.session);
    target.followRequests = alreadyRequested
      ? (target.followRequests || []).filter(x => x !== state.session)
      : [...(target.followRequests || []), state.session];
    render();
    try {
      await db.collection('profiles').doc(targetId).update({
        followRequests: alreadyRequested ? firebase.firestore.FieldValue.arrayRemove(state.session) : firebase.firestore.FieldValue.arrayUnion(state.session)
      });
    } catch(e){}
    return;
  }

  me.following = nowFollowing ? (me.following || []).filter(x => x !== targetId) : [...(me.following || []), targetId];
  target.followers = nowFollowing ? (target.followers || []).filter(x => x !== state.session) : [...(target.followers || []), state.session];
  render();
  try {
    await db.collection('profiles').doc(state.session).update({
      following: nowFollowing ? firebase.firestore.FieldValue.arrayRemove(targetId) : firebase.firestore.FieldValue.arrayUnion(targetId)
    });
    await db.collection('profiles').doc(targetId).update({
      followers: nowFollowing ? firebase.firestore.FieldValue.arrayRemove(state.session) : firebase.firestore.FieldValue.arrayUnion(state.session)
    });
  } catch(e){}
}

async function handleAcceptFollowRequest(requesterId){
  const me = state.profiles[state.session];
  const requester = state.profiles[requesterId];
  if (!me || !requester) return;
  me.followRequests = (me.followRequests || []).filter(x => x !== requesterId);
  me.followers = (me.followers || []).includes(requesterId) ? me.followers : [...(me.followers || []), requesterId];
  requester.following = (requester.following || []).includes(state.session) ? requester.following : [...(requester.following || []), state.session];
  render();
  try {
    await db.collection('profiles').doc(state.session).update({
      followRequests: firebase.firestore.FieldValue.arrayRemove(requesterId),
      followers: firebase.firestore.FieldValue.arrayUnion(requesterId)
    });
    await db.collection('profiles').doc(requesterId).update({
      following: firebase.firestore.FieldValue.arrayUnion(state.session)
    });
  } catch(e){}
}

async function handleDeclineFollowRequest(requesterId){

async function handleAdminAddId(){
  const id = (state.adminAddId || '').trim();
  const klass = state.adminAddClass;
  const section = state.adminAddSection || 'A';
  state.adminError = '';
  if (!parseIdCard(id)) { state.adminError = 'Invalid ID number — enter a 3-6 digit number.'; return render(); }
  const rawPassYear = (state.adminAddPassYear || '').trim();
  let passYear = null;
  if (rawPassYear){
    const py = parseInt(rawPassYear, 10);
    const thisYear = new Date().getFullYear();
    if (isNaN(py) || py < thisYear || py > thisYear + 6) { state.adminError = 'Invalid passing year — enter a valid year (e.g. ' + thisYear + ' or later).'; return render(); }
    passYear = py;
  }
  state.adminBusy = true; render();
  try {
    const record = { class: klass, section, passYear, addedAt: Date.now(), addedBy: state.session };
    await db.collection('validIds').doc(id).set(record);
    state.validIds[id] = record;
    state.adminAddId = '';
    state.adminAddPassYear = '';
  } catch(e){
    state.adminError = firebaseErrorMessage(e);
  }
  state.adminBusy = false;
  render();
}

async function handleAdminBulkAdd(){
  const raw = state.adminBulkIds || '';
  const lines = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const entries = [];
  let skipped = 0;
  const thisYear = new Date().getFullYear();
  lines.forEach(line => {
    const parts = line.split(',').map(s => s.trim());
    const id = parts[0] || '';
    const klass = parts[1] || '';
    const section = (parts[2] || '').toUpperCase();
    const rawPassYear = parts[3] || '';
    let passYear = null;
    let passYearOk = true;
    if (rawPassYear){
      const py = parseInt(rawPassYear, 10);
      passYearOk = !isNaN(py) && py >= thisYear && py <= thisYear + 6;
      if (passYearOk) passYear = py;
    }
    if (parseIdCard(id) && passYearOk) {
      entries.push({ id, class: klass, section, passYear });
    } else {
      skipped++;
    }
  });
  if (entries.length === 0) { state.adminError = 'No valid lines found. Format: ID,Class,Section,PassingYear (e.g. 11851,10,A).'; return render(); }
  state.adminError = '';
  state.adminBusy = true; render();
  try {
    const batch = db.batch();
    entries.forEach(({ id, class: klass, section, passYear }) => {
      const record = { class: klass, section, passYear, addedAt: Date.now(), addedBy: state.session };
      batch.set(db.collection('validIds').doc(id), record);
      state.validIds[id] = record;
    });
    await batch.commit();
    state.adminBulkIds = '';
    if (skipped > 0) state.adminError = `${skipped} line(s) had an invalid format (need a valid ID number) so they were skipped.`;
  } catch(e){
    state.adminError = firebaseErrorMessage(e);
  }
  state.adminBusy = false;
  render();
}

async function handleAdminRemoveId(id){
  try {
    await db.collection('validIds').doc(id).delete();
    delete state.validIds[id];
  } catch(e){}
  /* Agar is ID card se pehle koi student account ban chuka tha, to uski
     'profiles' document bhi yahin clean kar dete hain — warna wo purani
     document Firestore mein reh jaati aur is ID number ko future mein
     kisi naye student ko dobara diya jaaye to uska signup "Firestore
     permission error" (permission-denied) de kar fail ho jaata, kyunki
     Firestore ek maujooda document par set() ko "create" nahi "update"
     maanta hai aur update rule alag uid se allow nahi karta. Best-effort
     hai (agar profile nahi mili ya delete rule kisi wajah se fail ho,
     to bhi whitelist se hataana already ho chuka hoga). */
  try {
    const staleProfile = await db.collection('profiles').doc(id).get();
    if (staleProfile.exists && staleProfile.data().role !== 'admin'){
      await db.collection('profiles').doc(id).delete();
      delete state.profiles[id];
    }
  } catch(e){}
  render();
}

function chatKey(a, b){ return [a, b].sort().join('__'); }

/* Naye message ka badge dikhane ke liye — poori tarah is device ki
   localStorage mein rakha jaata hai (Firestore mein koi naya field/
   collection nahi, isliye rules mein bhi kuchh change nahi karna
   padta). Har chat ke liye "aakhri baar kab dekha" time save karte
   hain — jab bhi chat ka lastTime us se naya ho aur last message
   humne khud na bheja ho, to unread maante hain. */
function getChatSeenTime(chatId){
  return parseInt(localStorage.getItem('fc_chat_seen_' + chatId) || '0', 10);
}
function markChatSeen(chatId, time){
  try { localStorage.setItem('fc_chat_seen_' + chatId, String(time || Date.now())); } catch(e){}
}
function isChatUnread(c){
  if (!c.lastFrom || c.lastFrom === state.session) return false;
  return c.lastTime > getChatSeenTime(chatKey(state.session, c.otherId));
}
function unreadChatCount(){
  return (state.chatList || []).filter(isChatUnread).length;
}

/* ===== Purane chat messages ka auto-cleanup (Firestore quota bachane ke
   liye) =====
   6 mahine se purane chat messages Firestore se apne aap delete ho
   jaate hain, jab bhi wo chat kholi jaati hai — isse Firestore storage
   aur reads dono lambe samay tak free tier mein rehte hain.
   IMPORTANT: yeh sirf Firestore ka message document delete karta hai.
   Attachment ki asli photo/PDF Cloudinary par store hoti hai, aur use
   surakshit tarike se client-side delete nahi kiya ja sakta (uske liye
   Cloudinary ki secret API key chahiye hoti, jo website ke code mein
   kabhi nahi rakhni chahiye — koi bhi "view source" karke use dekh
   kar poora account misuse kar sakta hai). Cloudinary storage khud
   kabhi-kabhi Cloudinary dashboard se manually clear karna hi safe
   tarika hai. Best-effort hai — fail ho to chat load hona nahi rukta. */
const CHAT_MESSAGE_RETENTION_DAYS = 180;

async function cleanupOldChatMessages(chatId){
  const cutoff = Date.now() - (CHAT_MESSAGE_RETENTION_DAYS * 24 * 60 * 60 * 1000);
  try {
    const oldSnap = await db.collection('chats').doc(chatId).collection('messages')
      .where('time', '<', cutoff).limit(50).get();
    if (oldSnap.empty) return;
    const batch = db.batch();
    oldSnap.forEach(d => batch.delete(d.ref));
    await batch.commit();
  } catch(e){ /* best-effort — fail ho to bhi chat normally kaam karti rahe */ }
}

async function openChat(contactId){
  state.viewingProfile = null;
  state.chatWith = contactId;
  state.chatText = '';
  state.chatMessages = [];
  state.chatError = '';
  state.chatUploading = false;
  render();

  const myUid = auth.currentUser && auth.currentUser.uid;
  const other = state.profiles[contactId];
  if (!myUid || !other || !other.uid) return;
  const chatId = chatKey(state.session, contactId);

  /* chat "room" doc create/ensure karo (idempotent) taaki security rules
     dono participants ko subcollection access de saken */
  try {
    await db.collection('chats').doc(chatId).set({
      participants: [state.session, contactId].sort(),
      participantUids: [myUid, other.uid].sort(),
    }, { merge: true });
  } catch(e){}

  cleanupOldChatMessages(chatId); /* fire-and-forget, chat load ko block nahi karta */

  if (unsubChatMsgs) unsubChatMsgs();
  unsubChatMsgs = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('time', 'asc')
    .onSnapshot(snap => {
      state.chatMessages = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      markChatSeen(chatId, Date.now());
      render();
      const scroll = root.querySelector('#chat-scroll');
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
    }, () => { state.chatMessages = []; });
}

async function handleSendChatFile(file){
  if (!state.chatWith) return;
  const me = state.profiles[state.session];
  const other = state.profiles[state.chatWith];
  const isBlocked = (me.blocked||[]).includes(state.chatWith) || (other.blocked||[]).includes(state.session);
  if (isBlocked) return;
  const myUid = auth.currentUser && auth.currentUser.uid;
  if (!myUid || !other.uid) return;

  state.chatError = '';
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if (!isImage && !isPdf){
    state.chatError = 'You can only send a photo or PDF.';
    return render();
  }
  const usageCheck = await checkAndBumpUsage(isImage ? 'chatPhotos' : 'chatPdfs', isImage ? DAILY_CHAT_PHOTO_LIMIT : DAILY_CHAT_PDF_LIMIT);
  if (!usageCheck.allowed){
    state.chatError = isImage
      ? `Today's chat photo sending limit (${DAILY_CHAT_PHOTO_LIMIT}) has been reached. Try again tomorrow.`
      : `Today's chat PDF sending limit (${DAILY_CHAT_PDF_LIMIT}) has been reached. Try again tomorrow.`;
    return render();
  }
  /* Cloudinary free plan ka bandwidth bachane ke liye size par ek seedhi
     limit — bade PDFs school office se seedhe share karein. */
  const maxBytes = isImage ? 8 * 1024 * 1024 : 5 * 1024 * 1024;
  if (file.size > maxBytes){
    state.chatError = isImage ? 'Photo must be smaller than 8MB.' : 'PDF must be smaller than 5MB.';
    return render();
  }

  state.chatUploading = true; render();
  try {
    let url, type, name;
    if (isImage){
      const dataUrl = await resizeImage(file, 1000);
      url = await uploadDataUrl(dataUrl, 'chat', myUid, 'image');
      type = 'image'; name = file.name;
    } else {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      url = await uploadDataUrl(dataUrl, 'chat', myUid, 'auto');
      type = 'pdf'; name = file.name;
    }

    const chatId = chatKey(state.session, state.chatWith);
    const time = Date.now();
    const previewText = type === 'image' ? '📷 Photo' : '📄 ' + (name || 'Document.pdf');
    await db.collection('chats').doc(chatId).set({
      participants: [state.session, state.chatWith].sort(),
      participantUids: [myUid, other.uid].sort(),
      lastText: previewText, lastTime: time, lastFrom: state.session,
    }, { merge: true });
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: state.session, fromUid: myUid, text: '', time,
      attachment: { url, type, name: name || '' }
    });
  } catch(e){
    state.chatError = 'Upload failed. Please try again.';
  }
  state.chatUploading = false;
  render();
}

async function handleSendChat(){
  const text = (state.chatText || '').trim();
  if (!text || !state.chatWith) return;
  state.chatError = '';
  const me = state.profiles[state.session];
  const other = state.profiles[state.chatWith];
  const isBlocked = (me.blocked||[]).includes(state.chatWith) || (other.blocked||[]).includes(state.session);
  if (isBlocked) return;
  const myUid = auth.currentUser && auth.currentUser.uid;
  if (!myUid || !other.uid) return;
  const chatId = chatKey(state.session, state.chatWith);
  const time = Date.now();
  state.chatText = '';
  render();
  try {
    await db.collection('chats').doc(chatId).set({
      participants: [state.session, state.chatWith].sort(),
      participantUids: [myUid, other.uid].sort(),
      lastText: text, lastTime: time, lastFrom: state.session,
    }, { merge: true });
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: state.session, fromUid: myUid, text, time
    });
  } catch(e){}
}

/* ================= boot ================= */
function renderBootError(){
  return `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="max-width:420px;text-align:center;">
      <div style="font-family:'Zilla Slab',serif;font-weight:600;font-size:20px;color:var(--maroon);margin-bottom:10px;">
        Could not connect
      </div>
      <div style="color:var(--ink-soft);font-size:14px;line-height:1.6;margin-bottom:16px;">
        This page failed to load — check your internet connection, or if you
        downloaded and opened this HTML file directly (via file://), it
        will not work that way. Upload it to a web host (Firebase Hosting, GitHub Pages,
        or any https server) and open it from there.
      </div>
      <button type="button" onclick="location.reload()" style="padding:11px 22px;border-radius:12px;background:var(--navy);color:#fff;font-weight:500;font-size:14px;">Try again</button>
    </div>
  </div>`;
}

(function boot(){
  let failed = false;
  try {
    initFirebase();
  } catch(e){
    console.error('Firebase init failed:', e);
    failed = true;
  }

  document.getElementById('loading').classList.add('hidden');
  root.classList.remove('hidden');

  if (failed){
    root.innerHTML = renderBootError();
    return;
  }

  render();
  auth.onAuthStateChanged(user => {
    if (user){
      state.session = idFromEmail(user.email);
      state.tab = 'home';
      state.authForm = { idCard:'', password:'', name:'', klass:'', section:'A', subject:'', photo:'', role:'student', adminCode:'' };
      subscribeChatList();
      fetchProfiles();
      fetchFeed();
      updateLastActive();
      startBackgroundRefresh();
      startUsageTimer();
    } else {
      teardownSubscriptions();
      stopUsageTimer();
      state.session = null;
      state.profiles = {};
      state.feed = [];
      state.chatList = [];
      state.chatMessages = [];
      state.chatWith = null;
      state.timeLimitReached = false;
    }
    render();
  });
})();
</script>
<script>
/* independent failsafe: agar upar wala script kisi bhi wajah se
   (parse error, network, CSP) bilkul chal hi na paaye, to bhi
   user hamesha ke liye loading screen par atka na rahe */
setTimeout(function(){
  var loading = document.getElementById('loading');
  var root = document.getElementById('root');
  if (loading && !loading.classList.contains('hidden')){
    loading.classList.add('hidden');
    if (root){
      root.classList.remove('hidden');
      if (!root.innerHTML){
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:Inter,sans-serif;color:#7A2E2E;">Page failed to load. Check your internet connection or open this file from a web host (not file://), then try again.</div>';
      }
    }
  }
}, 8000);
</script>
