async function handleLogin(){
  const id = (state.authForm.idCard || '').trim().toUpperCase();
  const password = state.authForm.password || '';
  state.authError = '';
  if (!id) { state.authError = 'ID card number daaliye.'; return render(); }
  if (!parseIdCard(id)) { state.authError = 'ID card number galat hai. Apne school ID card par likha "S R No." daaliye (sirf number, jaise 11851).'; return render(); }
  if (!password) { state.authError = 'Password daaliye.'; return render(); }
  state.authBusy = true; render();
  try {
    await withTimeout(auth.signInWithEmailAndPassword(emailForId(id), password), 15000);
    /* onAuthStateChanged session set karega aur data load karega */
  } catch(e){
    state.authError = firebaseErrorMessage(e);
  }
  state.authBusy = false;
  render();
}

async function handleCreate(){
  const f = state.authForm;
  const id = (f.idCard || '').trim().toUpperCase();
  const password = f.password || '';
  const isAdmin = f.role === 'admin';
  state.authError = '';

  if (!id) { state.authError = 'ID card number daaliye.'; return render(); }
  const parsedId = parseIdCard(id);
  if (!parsedId) { state.authError = 'ID card number galat hai. Apne school ID card par likha "S R No." daaliye (sirf number, jaise 11851).'; return render(); }
  if (!password || password.length < 6) { state.authError = 'Password kam se kam 6 character ka hona chahiye.'; return render(); }
  if (!f.name.trim()) { state.authError = 'Naam daaliye.'; return render(); }
  if (!f.subject.trim()) { state.authError = isAdmin ? 'Designation/subject daaliye.' : 'Subject daaliye.'; return render(); }
  if (isAdmin && (f.adminCode || '').trim() !== ADMIN_CODE) { state.authError = 'Galat admin passcode.'; return render(); }

  state.authBusy = true; render();
  try {
    /* Student ke liye asli verification: ID card number school ki official
       whitelist ('validIds' collection) mein hona zaroori hai. IMPORTANT —
       is student ki Class aur Section KABHI form se nahi li jaati; wo
       hamesha admin ne whitelist mein jo record daala hai wahi se aati hai.
       Isse koi bhi student dropdown mein "Class 10" chunkar apni asli
       (Class 6-9) umar chhupa nahi sakta — kyunki ab dropdown hai hi nahi,
       aur class server-side (Firestore) record se tay hoti hai, client se
       nahi. */
    let studentClass = '', studentSection = '', studentPassYear = null;
    if (!isAdmin){
      const validDoc = await withTimeout(db.collection('validIds').doc(id).get(), 15000);
      if (!validDoc.exists) {
        state.authError = 'Yeh ID card number FFC ki official list mein register nahi hai. School office/admin se apna number confirm karwa kar dobara try karein.';
        state.authBusy = false;
        return render();
      }
      const record = validDoc.data() || {};
      studentClass = String(record.class || '');
      studentSection = record.section || 'A';
      studentPassYear = record.passYear || null;
      const classNum = parseInt(studentClass, 10);
      if (!studentClass || isNaN(classNum) || classNum < 10) {
        state.authError = 'Yeh website sirf Class 10 aur usse upar ke students ke liye chalu hai. School record ke mutabik yeh ID card Class 10 se neeche ke liye hai, isliye register nahi ho sakta.';
        state.authBusy = false;
        return render();
      }
    }

    const cred = await withTimeout(auth.createUserWithEmailAndPassword(emailForId(id), password), 15000);

    try {
      /* Naya account banne ke turant baad, agla koi bhi Firestore call
         (jaise neeche wala users-count check) kabhi-kabhi "permission-denied"
         de sakta hai — kyunki naye account ka login-token Firestore tak
         pahunchne mein ek pal ki der lag sakti hai. Isse ek adhoora/orphan
         account ban jaata, jisme login ho jaata hai (kyunki account bana
         hi tha) lekin profile kabhi nahi banti, aur wo ID card hamesha ke
         liye atak jaata. Isse rokne ke liye, pehle token ko explicitly
         refresh karke pakka karte hain ki wo Firestore ke liye taiyar hai. */
      await withTimeout(cred.user.getIdToken(true), 15000);

      /* ===== Total user cap check =====
         'profiles' collection sirf logged-in user hi read kar sakta hai
         (Firestore Rules), isliye yeh check bhi Auth account banne ke
         BAAD hi ho sakta hai — bilkul naam-duplicate check jaisa pattern.
         Poori collection ka count liya jaata hai (student + admin dono
         milakar); fetchProfiles bhi waise hi poori collection fetch
         karta hai, isliye yeh ek extra read school-scale app ke liye
         theek hai. Limit poori mile to abhi-abhi bana Auth account turant
         delete kar dete hain, taaki koi orphan/adhoora account na bache. */
      const profilesSnap = await withTimeout(db.collection('profiles').get(), 15000);
      if (profilesSnap.size >= MAX_TOTAL_USERS) {
        state.authError = `FFC College Network par register hone ki limit (${MAX_TOTAL_USERS} users) poori ho chuki hai. Naye account is waqt nahi ban sakte — school admin se sampark karein.`;
        try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
        state.authBusy = false;
        return render();
      }

      /* Naam sign-in hone ke baad hi check ho sakta hai (Firestore Rules
         mein profiles read sirf logged-in user ke liye allowed hai) —
         isliye yeh check auth account banne ke turant baad, profile
         Firestore mein save hone se PEHLE karte hain. Agar naam pehle se
         kisi ka hai, to abhi-abhi bana auth account bhi turant delete
         kar dete hain, taaki koi orphan/adhoora account na bache. */
      const nameTaken = await nameAlreadyTaken(f.name.trim(), id);
      if (nameTaken) {
        state.authError = 'Yeh naam pehle se kisi aur (student ya admin) ke profile mein use ho raha hai. Kripya thoda alag naam try karein (jaise surname/middle name add karke).';
        try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
        state.authBusy = false;
        return render();
      }

      /* Agar isi ID card number ki koi PURANI profile document pehle se
         Firestore mein maujood hai (jaise koi purana student jiska ID
         admin ne whitelist se hata diya tha lekin uski profile clean
         hone se pehle hi kisi ne dobara register karne ki koshish ki),
         to abhi hi rok dete hain — warna aage wala .set() Firestore ko
         "create" ki jagah "update" lagega (kyunki doc pehle se hai) aur
         confusing "Firestore permission error" dega. Yahan clear
         Hindi/Urdu message dete hain taaki student admin se sampark
         kar sake. */
      const existingProfile = await withTimeout(db.collection('profiles').doc(id).get(), 15000);
      if (existingProfile.exists) {
        state.authError = 'Is ID card number ka ek purana profile record pehle se maujood hai. Kripya school admin se sampark karein taaki wo purana record clear karke aapko dobara register karwa sakein.';
        try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
        state.authBusy = false;
        return render();
      }

      const photoUrl = await withTimeout(uploadDataUrl(f.photo, 'profile-photos', cred.user.uid), 20000).catch(() => '');
      const newProfile = isAdmin
        ? { idCard:id, uid: cred.user.uid, name:f.name.trim(), photo:photoUrl, class:'Staff', section:'', subject:f.subject.trim(), role:'admin', following:[], followers:[], blocked:[], verified:true, verificationRequested:false, marksheetPercent:null, marksheetPhoto:'' }
        : { idCard:id, uid: cred.user.uid, name:f.name.trim(), photo:photoUrl, class:studentClass, section:studentSection, passYear:studentPassYear, subject:f.subject.trim(), role:'student', following:[], followers:[], blocked:[], verified:false, verificationRequested:false, marksheetPercent:null, marksheetPhoto:'' };
      await withTimeout(db.collection('profiles').doc(id).set(newProfile), 15000);
      /* onAuthStateChanged session set karega aur data load karega */
    } catch(innerErr){
      /* Account bana chuka tha lekin profile complete hone se pehle kuch
         fail ho gaya (jaise permission-denied ka timing-glitch) — is
         adhoore account ko turant delete kar dete hain, taaki yeh ID
         card kabhi "stuck" na ho aur student turant dobara try kar sake. */
      try { await cred.user.delete(); } catch(delErr){ try { await auth.signOut(); } catch(e2){} }
      throw innerErr;
    }
  } catch(e){
    state.authError = firebaseErrorMessage(e);
  }
  state.authBusy = false;
  render();
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

/* Har student ke liye roz ka ek limit — taaki koi ek user bahut zyada
   posts ya chat photo/PDF bhej kar Cloudinary/Firestore ka free quota
   akela hi khatam na kar de. Admin/staff par ye limit nahi lagti.
   Count khud us student ki apni profile document mein save hota hai
   (usage.date/usage.posts/usage.postPhotos/usage.chatPhotos/
   usage.chatPdfs) — security rules ke mutabik student apni hi profile
   ke non-verified fields khud badal sakta hai, isliye koi rule change
   karne ki zarurat nahi padi. runTransaction use kiya hai taaki
   double-tap se count galat na ho. */
async function checkAndBumpUsage(kind, limit){
  const me = state.profiles[state.session];
  if (me && me.role === 'admin') return { allowed: true };
  const ref = db.collection('profiles').doc(state.session);
  const today = todayStr();
  try {
    let result;
    await db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      const data = snap.data() || {};
      const blank = { date: today, posts: 0, postPhotos: 0, chatPhotos: 0, chatPdfs: 0 };
      let usage = data.usage || blank;
      if (usage.date !== today) usage = { ...blank };
      const current = usage[kind] || 0;
      if (current >= limit) { result = { allowed: false, count: current }; return; }
      usage[kind] = current + 1;
      tx.update(ref, { usage });
      result = { allowed: true, count: usage[kind] };
    });
    return result;
  } catch(e){
    /* Agar limit-check khud fail ho jaaye (network waghera), post/message
       ko block nahi karte — behtar hai ek extra post jaane dena bajaye
       poori feature ko todne ke. */
    return { allowed: true };
  }
}

const DAILY_POST_LIMIT = 5;
const DAILY_POST_PHOTO_LIMIT = 1;
const DAILY_CHAT_PHOTO_LIMIT = 5;
const DAILY_CHAT_PDF_LIMIT = 5;

async function handlePost(){
  const c = state.composer;
  if (!c.text.trim() && !c.image) return;
  c.error = '';
  if (c.image){
    const photoCheck = await checkAndBumpUsage('postPhotos', DAILY_POST_PHOTO_LIMIT);
    if (!photoCheck.allowed){
      c.error = `Aaj ki photo upload limit (${DAILY_POST_PHOTO_LIMIT}) khatam ho gayi hai. Sirf text ke saath post karein, ya kal photo ke saath try karein.`;
      return render();
    }
  }
  const usageCheck = await checkAndBumpUsage('posts', DAILY_POST_LIMIT);
  if (!usageCheck.allowed){
    c.error = `Aaj ki post limit (${DAILY_POST_LIMIT}) khatam ho gayi hai. Kal phir try karein.`;
    return render();
  }
  const profile = state.profiles[state.session];
  let imageUrl = '';
  try { imageUrl = await uploadDataUrl(c.image, 'post-images'); } catch(e){ imageUrl = ''; }
  const newPost = {
    idCard: profile.idCard, name: profile.name, photo: profile.photo,
    class: profile.class, section: profile.section,
    text: c.text.trim(), image: imageUrl, time: Date.now(), likes: [],
  };
  try {
    const ref = await db.collection('posts').add(newPost);
    state.feed.unshift({ ...newPost, id: ref.id });
  } catch(e){}
  state.composer = { text:'', image:'', error:'' };
  render();
}

async function handleLike(postId){
  const post = state.feed.find(p => p.id === postId);
  if (!post) return;
  const liked = (post.likes || []).includes(state.session);
  post.likes = liked ? (post.likes || []).filter(x => x !== state.session) : [...(post.likes || []), state.session];
  render();
  try {
    await db.collection('posts').doc(postId).update({
      likes: liked ? firebase.firestore.FieldValue.arrayRemove(state.session) : firebase.firestore.FieldValue.arrayUnion(state.session)
    });
  } catch(e){}
}

async function handleDeletePost(postId){
  const post = state.feed.find(p => p.id === postId);
  if (!post) return;
  if (!confirm('Ye post delete karna chahte hain?')) return;
  const idx = state.feed.indexOf(post);
  state.feed.splice(idx, 1);
  render();
  try {
    await db.collection('posts').doc(postId).delete();
  } catch(e){
    state.feed.splice(idx, 0, post);
    render();
  }
}

async function handleSaveProfile(){
  const profile = state.profiles[state.session];
  const e = state.profileEdit;
  const photoUrl = await uploadDataUrl(e.photo, 'profile-photos').catch(() => profile.photo || '');

  /* Naam sirf mahine mein ek baar badal sakta hai (student ho ya admin,
     dono ke liye). Agar cooldown chal raha hai to naam purana hi rehta
     hai — baaki (photo) normally save ho jaata hai. Naya naam
     poori website par kisi aur ke profile mein already use nahi hona
     chahiye — dono students aur admin ke naam is check mein aate hain. */
  const requestedName = e.name.trim() || profile.name;
  const nameChanged = requestedName !== profile.name;
  const stillLocked = nameChangeDaysLeft(profile) > 0;
  state.profileNameError = '';
  let nameUpdate = {};
  if (nameChanged && !stillLocked) {
    const taken = await nameAlreadyTaken(requestedName, state.session);
    if (taken) {
      state.profileNameError = 'Yeh naam pehle se kisi aur (student ya admin) ke profile mein use ho raha hai — koi doosra naam try karein.';
    } else {
      nameUpdate = { name: requestedName, lastNameChangeAt: Date.now() };
    }
  }

  const updated = {
    ...nameUpdate,
    photo: photoUrl,
  };
  try { await db.collection('profiles').doc(state.session).update(updated); state.profiles[state.session] = { ...profile, ...updated }; } catch(e){}
  if (!state.profileNameError) state.profileEdit = null;
  state.profileSaved = true;
  render();
  setTimeout(() => { state.profileSaved = false; render(); }, 1800);
}

async function handleChangePassword(){
  const pc = state.passwordChange;
  pc.error = ''; pc.success = false;
  if (!pc.current) { pc.error = 'Purana password daaliye.'; return render(); }
  if (!pc.next || pc.next.length < 6) { pc.error = 'Naya password kam se kam 6 character ka hona chahiye.'; return render(); }
  pc.busy = true; render();
  try {
    const user = auth.currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, pc.current);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(pc.next);
    state.passwordChange = { current:'', next:'', error:'', busy:false, success:true };
  } catch(e){
    pc.busy = false;
    pc.error = firebaseErrorMessage(e);
  }
  render();
}

async function handleToggleFollow(targetId){
  const me = state.profiles[state.session];
  const target = state.profiles[targetId];
  if (!me || !target) return;
  const nowFollowing = (me.following || []).includes(targetId);
  me.following = nowFollowing ? (me.following || []).filter(x => x !== targetId) : [...(me.following || []), targetId];
  target.followers = nowFollowing ? (target.followers || []).filter(x => x !== state.session) : [...(target.followers || []), state.session];
  render();
  try {
    await db.collection('profiles').doc(state.session).update({
      following: nowFollowing ? firebase.firestore.FieldValue.arrayRemove(targetId) : firebase.firestore.FieldValue.arrayUnion(targetId)
    });
    await db.collection('profiles').doc(targetId).update({
      followers: nowFollowing ? firebase.firestore.FieldValue.arrayRemove(state.session) : firebase.firestore.FieldValue.arrayUnion(state.session)
    });
  } catch(e){}
}

async function handleToggleBlock(targetId){
  const me = state.profiles[state.session];
  if (!me) return;
  const isBlocked = (me.blocked || []).includes(targetId);
  me.blocked = isBlocked ? (me.blocked || []).filter(x => x !== targetId) : [...(me.blocked || []), targetId];
  try {
    await db.collection('profiles').doc(state.session).update({
      blocked: isBlocked ? firebase.firestore.FieldValue.arrayRemove(targetId) : firebase.firestore.FieldValue.arrayUnion(targetId)
    });
  } catch(e){}
  render();
}

async function handleAdminAddId(){
  const id = (state.adminAddId || '').trim();
  const klass = state.adminAddClass;
  const section = state.adminAddSection || 'A';
  state.adminError = '';
  if (!parseIdCard(id)) { state.adminError = 'ID number galat hai — sirf 3-6 digit ka number daalein.'; return render(); }
  const classNum = parseInt(klass, 10);
  if (!klass || isNaN(classNum) || classNum < 10 || classNum > 12) { state.adminError = 'Class chuniye (10 se 12 ke beech) — is website ki class-gate isi field se kaam karti hai.'; return render(); }
  const rawPassYear = (state.adminAddPassYear || '').trim();
  let passYear = null;
  if (rawPassYear){
    const py = parseInt(rawPassYear, 10);
    const thisYear = new Date().getFullYear();
    if (isNaN(py) || py < thisYear || py > thisYear + 6) { state.adminError = 'Passing year galat hai — ek theek saal daalein (jaise ' + thisYear + ' ya usse aage).'; return render(); }
    passYear = py;
  }
  state.adminBusy = true; render();
  try {
    const record = { class: klass, section, passYear, addedAt: Date.now(), addedBy: state.session };
    await db.collection('validIds').doc(id).set(record);
    state.validIds[id] = record;
    state.adminAddId = '';
    state.adminAddPassYear = '';
  } catch(e){
    state.adminError = firebaseErrorMessage(e);
  }
  state.adminBusy = false;
  render();
}

async function handleAdminBulkAdd(){
  const raw = state.adminBulkIds || '';
  const lines = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const entries = [];
  let skipped = 0;
  const thisYear = new Date().getFullYear();
  lines.forEach(line => {
    const parts = line.split(',').map(s => s.trim());
    const id = parts[0] || '';
    const klass = parts[1] || '';
    const section = (parts[2] || 'A').toUpperCase();
    const rawPassYear = parts[3] || '';
    const classNum = parseInt(klass, 10);
    let passYear = null;
    let passYearOk = true;
    if (rawPassYear){
      const py = parseInt(rawPassYear, 10);
      passYearOk = !isNaN(py) && py >= thisYear && py <= thisYear + 6;
      if (passYearOk) passYear = py;
    }
    if (parseIdCard(id) && !isNaN(classNum) && classNum >= 10 && classNum <= 12 && (section === 'A' || section === 'B') && passYearOk) {
      entries.push({ id, class: klass, section, passYear });
    } else {
      skipped++;
    }
  });
  if (entries.length === 0) { state.adminError = 'Koi valid line nahi mili. Format: ID,Class,Section,PassingYear (jaise 11851,10,A).'; return render(); }
  state.adminError = '';
  state.adminBusy = true; render();
  try {
    const batch = db.batch();
    entries.forEach(({ id, class: klass, section, passYear }) => {
      const record = { class: klass, section, passYear, addedAt: Date.now(), addedBy: state.session };
      batch.set(db.collection('validIds').doc(id), record);
      state.validIds[id] = record;
    });
    await batch.commit();
    state.adminBulkIds = '';
    if (skipped > 0) state.adminError = `${skipped} line(s) galat format ki thi (ID,Class,Section chahiye — Class 10-12 aur Section A/B) isliye skip ho gayi.`;
  } catch(e){
    state.adminError = firebaseErrorMessage(e);
  }
  state.adminBusy = false;
  render();
}

async function handleAdminRemoveId(id){
  try {
    await db.collection('validIds').doc(id).delete();
    delete state.validIds[id];
  } catch(e){}
  /* Agar is ID card se pehle koi student account ban chuka tha, to uski
     'profiles' document bhi yahin clean kar dete hain — warna wo purani
     document Firestore mein reh jaati aur is ID number ko future mein
     kisi naye student ko dobara diya jaaye to uska signup "Firestore
     permission error" (permission-denied) de kar fail ho jaata, kyunki
     Firestore ek maujooda document par set() ko "create" nahi "update"
     maanta hai aur update rule alag uid se allow nahi karta. Best-effort
     hai (agar profile nahi mili ya delete rule kisi wajah se fail ho,
     to bhi whitelist se hataana already ho chuka hoga). */
  try {
    const staleProfile = await db.collection('profiles').doc(id).get();
    if (staleProfile.exists && staleProfile.data().role !== 'admin'){
      await db.collection('profiles').doc(id).delete();
      delete state.profiles[id];
    }
  } catch(e){}
  render();
}

function chatKey(a, b){ return [a, b].sort().join('__'); }

/* ===== Purane chat messages ka auto-cleanup (Firestore quota bachane ke
   liye) =====
   6 mahine se purane chat messages Firestore se apne aap delete ho
   jaate hain, jab bhi wo chat kholi jaati hai — isse Firestore storage
   aur reads dono lambe samay tak free tier mein rehte hain.
   IMPORTANT: yeh sirf Firestore ka message document delete karta hai.
   Attachment ki asli photo/PDF Cloudinary par store hoti hai, aur use
   surakshit tarike se client-side delete nahi kiya ja sakta (uske liye
   Cloudinary ki secret API key chahiye hoti, jo website ke code mein
   kabhi nahi rakhni chahiye — koi bhi "view source" karke use dekh
   kar poora account misuse kar sakta hai). Cloudinary storage khud
   kabhi-kabhi Cloudinary dashboard se manually clear karna hi safe
   tarika hai. Best-effort hai — fail ho to chat load hona nahi rukta. */
const CHAT_MESSAGE_RETENTION_DAYS = 180;

async function cleanupOldChatMessages(chatId){
  const cutoff = Date.now() - (CHAT_MESSAGE_RETENTION_DAYS * 24 * 60 * 60 * 1000);
  try {
    const oldSnap = await db.collection('chats').doc(chatId).collection('messages')
      .where('time', '<', cutoff).limit(50).get();
    if (oldSnap.empty) return;
    const batch = db.batch();
    oldSnap.forEach(d => batch.delete(d.ref));
    await batch.commit();
  } catch(e){ /* best-effort — fail ho to bhi chat normally kaam karti rahe */ }
}

async function openChat(contactId){
  state.viewingProfile = null;
  state.chatWith = contactId;
  state.chatText = '';
  state.chatMessages = [];
  state.chatError = '';
  state.chatUploading = false;
  render();

  const myUid = auth.currentUser && auth.currentUser.uid;
  const other = state.profiles[contactId];
  if (!myUid || !other || !other.uid) return;
  const chatId = chatKey(state.session, contactId);

  /* chat "room" doc create/ensure karo (idempotent) taaki security rules
     dono participants ko subcollection access de saken */
  try {
    await db.collection('chats').doc(chatId).set({
      participants: [state.session, contactId].sort(),
      participantUids: [myUid, other.uid].sort(),
    }, { merge: true });
  } catch(e){}

  cleanupOldChatMessages(chatId); /* fire-and-forget, chat load ko block nahi karta */

  if (unsubChatMsgs) unsubChatMsgs();
  unsubChatMsgs = db.collection('chats').doc(chatId).collection('messages')
    .orderBy('time', 'asc')
    .onSnapshot(snap => {
      state.chatMessages = snap.docs.map(d => d.data());
      render();
      const scroll = root.querySelector('#chat-scroll');
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
    }, () => { state.chatMessages = []; });
}

async function handleSendChatFile(file){
  if (!state.chatWith) return;
  const me = state.profiles[state.session];
  const other = state.profiles[state.chatWith];
  const isBlocked = (me.blocked||[]).includes(state.chatWith) || (other.blocked||[]).includes(state.session);
  if (isBlocked) return;
  const myUid = auth.currentUser && auth.currentUser.uid;
  if (!myUid || !other.uid) return;

  state.chatError = '';
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if (!isImage && !isPdf){
    state.chatError = 'Sirf photo ya PDF hi bhej sakte hain.';
    return render();
  }
  const usageCheck = await checkAndBumpUsage(isImage ? 'chatPhotos' : 'chatPdfs', isImage ? DAILY_CHAT_PHOTO_LIMIT : DAILY_CHAT_PDF_LIMIT);
  if (!usageCheck.allowed){
    state.chatError = isImage
      ? `Aaj ki chat photo bhejne ki limit (${DAILY_CHAT_PHOTO_LIMIT}) khatam ho gayi hai. Kal phir try karein.`
      : `Aaj ki chat PDF bhejne ki limit (${DAILY_CHAT_PDF_LIMIT}) khatam ho gayi hai. Kal phir try karein.`;
    return render();
  }
  /* Cloudinary free plan ka bandwidth bachane ke liye size par ek seedhi
     limit — bade PDFs school office se seedhe share karein. */
  const maxBytes = isImage ? 8 * 1024 * 1024 : 5 * 1024 * 1024;
  if (file.size > maxBytes){
    state.chatError = isImage ? 'Photo 8MB se choti honi chahiye.' : 'PDF 5MB se chota hona chahiye.';
    return render();
  }

  state.chatUploading = true; render();
  try {
    let url, type, name;
    if (isImage){
      const dataUrl = await resizeImage(file, 1000);
      url = await uploadDataUrl(dataUrl, 'chat', myUid, 'image');
      type = 'image'; name = file.name;
    } else {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      url = await uploadDataUrl(dataUrl, 'chat', myUid, 'auto');
      type = 'pdf'; name = file.name;
    }

    const chatId = chatKey(state.session, state.chatWith);
    const time = Date.now();
    const previewText = type === 'image' ? '📷 Photo' : '📄 ' + (name || 'Document.pdf');
    await db.collection('chats').doc(chatId).set({
      participants: [state.session, state.chatWith].sort(),
      participantUids: [myUid, other.uid].sort(),
      lastText: previewText, lastTime: time,
    }, { merge: true });
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: state.session, fromUid: myUid, text: '', time,
      attachment: { url, type, name: name || '' }
    });
  } catch(e){
    state.chatError = 'Upload nahi ho paaya. Dobara try karein.';
  }
  state.chatUploading = false;
  render();
}

async function handleSendChat(){
  const text = (state.chatText || '').trim();
  if (!text || !state.chatWith) return;
  state.chatError = '';
  const me = state.profiles[state.session];
  const other = state.profiles[state.chatWith];
  const isBlocked = (me.blocked||[]).includes(state.chatWith) || (other.blocked||[]).includes(state.session);
  if (isBlocked) return;
  const myUid = auth.currentUser && auth.currentUser.uid;
  if (!myUid || !other.uid) return;
  const chatId = chatKey(state.session, state.chatWith);
  const time = Date.now();
  state.chatText = '';
  render();
  try {
    await db.collection('chats').doc(chatId).set({
      participants: [state.session, state.chatWith].sort(),
      participantUids: [myUid, other.uid].sort(),
      lastText: text, lastTime: time,
    }, { merge: true });
    await db.collection('chats').doc(chatId).collection('messages').add({
      from: state.session, fromUid: myUid, text, time
    });
  } catch(e){}
}

(function boot(){
  let failed = false;
  try {
    initFirebase();
  } catch(e){
    console.error('Firebase init failed:', e);
    failed = true;
  }

  document.getElementById('loading').classList.add('hidden');
  root.classList.remove('hidden');

  if (failed){
    root.innerHTML = renderBootError();
    return;
  }

  render();
  auth.onAuthStateChanged(user => {
    if (user){
      state.session = idFromEmail(user.email);
      state.tab = 'home';
      state.authForm = { idCard:'', password:'', name:'', klass:'', section:'A', subject:'', photo:'', role:'student', adminCode:'' };
      subscribeChatList();
      fetchProfiles();
      fetchFeed();
      startBackgroundRefresh();
      startUsageTimer();
    } else {
      teardownSubscriptions();
      stopUsageTimer();
      state.session = null;
      state.profiles = {};
      state.feed = [];
      state.chatList = [];
      state.chatMessages = [];
      state.chatWith = null;
      state.timeLimitReached = false;
    }
    render();
  });
})();
</script>
<script>
/* independent failsafe: agar upar wala script kisi bhi wajah se
   (parse error, network, CSP) bilkul chal hi na paaye, to bhi
   user hamesha ke liye loading screen par atka na rahe */
setTimeout(function(){
  var loading = document.getElementById('loading');
  var root = document.getElementById('root');
  if (loading && !loading.classList.contains('hidden')){
    loading.classList.add('hidden');
    if (root){
      root.classList.remove('hidden');
      if (!root.innerHTML){
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:Inter,sans-serif;color:#7A2E2E;">Page load nahi ho saka. Internet check karein ya is file ko kisi web host (file:// nahi) se kholein, phir dobara try karein.</div>';
      }
    }
  }
}, 8000);
</script>
