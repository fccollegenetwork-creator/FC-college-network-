<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>SeniorCircle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#16244A;
    --navy-deep:#0E1830;
    --marigold:#D4A72A;
    --maroon:#7A2E2E;
    --sage:#4F7A5C;
    --paper:#F5F4EF;
    --paper-deep:#ECEAE1;
    --ink:#22293A;
    --ink-soft:#5B6478;
  
    --clay-shadow: 7px 7px 14px rgba(163,177,198,.5), -7px -7px 14px rgba(255,255,255,.9), inset 1px 1px 2px rgba(255,255,255,.6), inset -2px -2px 4px rgba(163,177,198,.18);
    --clay-shadow-sm: 4px 4px 9px rgba(163,177,198,.5), -4px -4px 9px rgba(255,255,255,.9), inset 1px 1px 1px rgba(255,255,255,.6), inset -1px -1px 2px rgba(163,177,198,.15);
    --clay-shadow-navy: 6px 6px 14px rgba(16,26,48,.35), -3px -3px 10px rgba(76,114,196,.2), inset 1px 1px 2px rgba(255,255,255,.3), inset -2px -2px 4px rgba(0,0,0,.2);
    --clay-shadow-press: inset 3px 3px 7px rgba(163,177,198,.55), inset -3px -3px 7px rgba(255,255,255,.85);
    --clay-shadow-deep: 5px 5px 12px rgba(163,177,198,.55), -5px -5px 12px rgba(255,255,255,.95), inset 1px 1px 2px rgba(255,255,255,.6), inset -1px -1px 2px rgba(163,177,198,.15);}
  /* ---- dark mode ----
     Sirf CSS variables switch hoti hain (poori file same rehti hai),
     aur ye choice sirf is browser ki "local memory" (localStorage) mein
     save hoti hai — Firebase se koi lena dena nahi, isliye 0% extra load. */
  body.dark-theme{
    --navy:#4C72C4;
    --navy-deep:#0A0F1C;
    --marigold:#E3A94A;
    --maroon:#E08A8A;
    --sage:#7FBF93;
    --paper:#12151C;
    --paper-deep:#1B1F29;
    --ink:#EDEEF2;
    --ink-soft:#9BA3B4;
    --clay-shadow: 7px 7px 14px rgba(0,0,0,.55), -7px -7px 14px rgba(255,255,255,.04), inset 1px 1px 2px rgba(255,255,255,.05), inset -2px -2px 4px rgba(0,0,0,.35);
    --clay-shadow-sm: 4px 4px 9px rgba(0,0,0,.55), -4px -4px 9px rgba(255,255,255,.04), inset 1px 1px 1px rgba(255,255,255,.05), inset -1px -1px 2px rgba(0,0,0,.3);
    --clay-shadow-navy: 6px 6px 14px rgba(0,0,0,.5), -3px -3px 10px rgba(76,114,196,.15), inset 1px 1px 2px rgba(255,255,255,.15), inset -2px -2px 4px rgba(0,0,0,.3);
    --clay-shadow-press: inset 3px 3px 7px rgba(0,0,0,.5), inset -3px -3px 7px rgba(255,255,255,.04);
    --clay-shadow-deep: 5px 5px 12px rgba(0,0,0,.55), -5px -5px 12px rgba(255,255,255,.04), inset 1px 1px 2px rgba(255,255,255,.05), inset -1px -1px 2px rgba(0,0,0,.3);
  }
  body.dark-theme .card, body.dark-theme .post-card, body.dark-theme .field input,
  body.dark-theme .field select, body.dark-theme .field textarea,
  body.dark-theme .chip, body.dark-theme .tool-card, body.dark-theme .idcard-qr-box,
  body.dark-theme .role-toggle button, body.dark-theme .search-bar,
  body.dark-theme .user-row, body.dark-theme .chat-list-row,
  body.dark-theme .chat-bubble-del, body.dark-theme .chat-attach-btn{
    background:var(--paper);
  }
  body.dark-theme .role-toggle button.active{background:var(--navy);}
  body.dark-theme header.topbar{background:rgba(18,21,28,.9);}
  body.dark-theme nav.bottombar{background:var(--paper);}
  body.dark-theme .idcard-qr-box svg, body.dark-theme .idcard-qr-box canvas, body.dark-theme .idcard-qr-box img{
    background:#fff;border-radius:8px;
  }
  *{box-sizing:border-box;}
  html{overscroll-behavior-y: contain;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;overscroll-behavior-y: contain;transition:background .2s,color .2s;}
  body.font-small #root{zoom:0.88;}
  body.font-large #root{zoom:1.15;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  img{display:block;}
  .hidden{display:none !important;}

  /* ---- layout shells ---- */
  #auth-screen{min-height:100vh;display:flex;flex-direction:column;}
  @media(min-width:1024px){ #auth-screen{flex-direction:row;} }
  .brand-panel{
    background:linear-gradient(160deg, var(--navy-deep), var(--navy));
    padding:40px 32px;display:flex;flex-direction:column;justify-content:space-between;
  }
  @media(min-width:1024px){ .brand-panel{width:42%;padding:64px 56px;} }
  .brand-top{display:flex;align-items:center;gap:8px;}
  .brand-title{color:white;font-family:'Zilla Slab',serif;font-size:18px;font-weight:600;}
  .brand-headline{color:white;font-family:'Zilla Slab',serif;font-weight:600;font-size:34px;line-height:1.15;margin:36px 0 12px;max-width:420px;}
  .brand-sub{color:#B9C1D6;max-width:360px;line-height:1.5;}
  .brand-note{display:none;align-items:flex-start;gap:8px;font-size:12px;color:#8A93AC;margin-top:16px;max-width:280px;}
  @media(min-width:1024px){ .brand-note{display:flex;} .brand-card{display:block !important;} }
  .brand-card{display:none;}

  .form-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
  .form-wrap{width:100%;max-width:420px;}

  .tabbar{display:flex;border-radius:999px;padding:5px;background:var(--paper);margin-bottom:28px;box-shadow:var(--clay-shadow-press);}
  .tabbar button{flex:1;padding:10px 0;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-soft);transition:.15s;}
  .tabbar button.active{background:var(--navy);color:#fff;box-shadow:var(--clay-shadow-navy);}

  .role-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .role-toggle button{flex:1;padding:9px 0;border-radius:16px;font-size:13px;font-weight:500;border:none;color:var(--ink-soft);background:var(--paper);box-shadow:var(--clay-shadow-sm);}
  .role-toggle button.active{background:var(--navy);color:#fff;box-shadow:var(--clay-shadow-navy);}
  .whitelist-badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:999px;flex-shrink:0;}
  .whitelist-badge.used{background:rgba(79,122,92,.15);color:var(--sage);}
  .whitelist-badge.free{background:var(--paper-deep);color:var(--ink-soft);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;border-radius:18px;border:none;background:var(--paper);color:var(--ink);outline:none;box-shadow:var(--clay-shadow-press);
  }
  .field input:focus, .field select:focus, .field textarea:focus{box-shadow:var(--clay-shadow-press), 0 0 0 2px var(--navy);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .btn-primary{width:100%;padding:13px 0;border-radius:20px;background:var(--navy);color:#fff;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--clay-shadow-navy);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{padding:9px 16px;border-radius:16px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:500;box-shadow:var(--clay-shadow-sm);}
  .error-note{font-size:13px;background:#F7E9E9;color:var(--maroon);padding:10px 12px;border-radius:16px;margin-bottom:14px;box-shadow:var(--clay-shadow-press);}
  .block-note{background:#F7E9E9;border:none;border-radius:18px;padding:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;color:var(--maroon);font-size:13px;box-shadow:var(--clay-shadow-press);}

  .photo-row{display:flex;align-items:center;gap:12px;}
  .photo-thumb{width:56px;height:56px;border-radius:18px;overflow:hidden;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--clay-shadow-sm);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}

  /* ---- ID card ---- */
  .idcard{position:relative;border-radius:26px;overflow:hidden;font-family:'IBM Plex Mono',monospace;box-shadow:10px 12px 26px rgba(0,0,0,.3), -6px -6px 18px rgba(255,255,255,.08);}
  .idcard.compact{width:220px;}
  .idcard.full{width:280px;}
  .idcard::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:40px;height:12px;border-radius:999px;background:var(--paper-deep);}
  .idcard-head{padding:22px 16px 10px;display:flex;justify-content:space-between;align-items:center;}
  .idcard-brand{font-size:9px;letter-spacing:.2em;color:var(--marigold);}
  .idcard-sub{font-size:8px;letter-spacing:.05em;color:#C9D0E0;margin-top:2px;}
  .idcard-body{padding:0 16px;display:flex;gap:12px;align-items:center;}
  .idcard-photo{width:64px;height:64px;border-radius:16px;overflow:hidden;flex-shrink:0;background:#2B3B5E;border:2px solid var(--marigold);display:flex;align-items:center;justify-content:center;}
  .idcard-photo img{width:100%;height:100%;object-fit:cover;}
  .idcard-name{color:#fff;font-family:'Zilla Slab',serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idcard-meta{font-size:10px;color:#C9D0E0;margin-top:2px;}
  .idcard-strip{margin-top:14px;padding:8px 16px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:space-between;}
  .idcard-id{font-size:8px;letter-spacing:.15em;color:#8A93AC;}
  .idcard-bars{display:flex;gap:2px;}
  .idcard-bars span{width:2px;background:var(--marigold);opacity:.8;}

  /* ---- app shell ---- */
  #app-shell{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{position:sticky;top:0;z-index:10;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,244,239,.9);backdrop-filter:blur(6px);border-bottom:none;box-shadow:0 6px 16px rgba(163,177,198,.35);}
  .topbar-brand{display:flex;align-items:center;gap:8px;font-family:'Zilla Slab',serif;font-weight:600;font-size:14px;color:var(--navy);}
  .logout-btn{font-size:12px;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--paper);color:var(--ink-soft);box-shadow:var(--clay-shadow-sm);}

  main{flex:1;padding:20px 16px;}
  nav.bottombar{position:sticky;bottom:0;display:flex;justify-content:space-around;padding:8px 0;background:var(--paper);border-top:none;box-shadow:0 -6px 16px rgba(163,177,198,.3);}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;flex:1;color:var(--ink-soft);}
  .nav-btn.active{color:var(--navy);}
  .nav-btn span{font-size:10px;font-weight:500;}
  .nav-badge{position:absolute;top:-6px;right:-8px;background:var(--maroon,#b3261e);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;box-shadow:2px 2px 5px rgba(0,0,0,.25);}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--maroon,#b3261e);flex-shrink:0;}

  /* composer + feed */
  .card{border-radius:24px;background:var(--paper);border:none;padding:16px;box-shadow:var(--clay-shadow);}
  .composer{display:flex;gap:12px;}
  .avatar{border-radius:999px;overflow:hidden;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--clay-shadow-sm);}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .composer-body{flex:1;}
  .composer textarea{width:100%;border:none;outline:none;resize:none;font-size:14px;color:var(--ink);background:transparent;}
  .composer-preview{position:relative;display:inline-block;margin-top:8px;}
  .composer-preview img{border-radius:16px;max-height:160px;object-fit:cover;}
  .composer-preview button{position:absolute;top:-8px;right:-8px;background:var(--paper);border-radius:999px;padding:4px;box-shadow:var(--clay-shadow-sm);}
  .composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .photo-btn{font-size:12px;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:14px;background:var(--paper);color:var(--ink-soft);box-shadow:var(--clay-shadow-sm);}
  .post-btn{font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;padding:9px 16px;border-radius:14px;background:var(--navy);color:#fff;box-shadow:var(--clay-shadow-navy);}

  .filter-row{display:flex;gap:8px;margin:16px 0;}
  .filter-chip{font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px;background:var(--paper);color:var(--ink-soft);box-shadow:var(--clay-shadow-sm);}
  .filter-chip.active{background:var(--navy);color:#fff;box-shadow:var(--clay-shadow-navy);}

  .empty-state{text-align:center;padding:60px 0;font-size:14px;color:var(--ink-soft);}
  .post-card{border-radius:24px;background:var(--paper);border:none;padding:16px;margin-bottom:12px;box-shadow:var(--clay-shadow);}
  .post-head{display:flex;align-items:center;gap:10px;}
  .post-headtext{flex:1;min-width:0;}
  .post-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .post-meta{font-size:11px;color:var(--ink-soft);}
  .section-pill{font-size:10px;font-weight:500;color:#fff;padding:2px 8px;border-radius:999px;flex-shrink:0;box-shadow:1px 1px 4px rgba(0,0,0,.2);}
  .post-text{font-size:14px;margin-top:10px;white-space:pre-wrap;}
  .post-image{border-radius:18px;margin-top:10px;width:100%;object-fit:cover;max-height:280px;}
  .data-saver-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--paper);border:1px dashed var(--ink-soft);border-radius:18px;color:var(--ink-soft);font-size:11.5px;cursor:pointer;width:100%;height:120px;margin-top:10px;box-shadow:var(--clay-shadow-press);}
  .chat-bubble-img.data-saver-placeholder{max-width:180px;height:100px;margin-top:0;}
  .like-btn{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ink-soft);}
  .like-btn.liked{color:var(--maroon);}

  /* profile tab */
  .profile-card-wrap{display:flex;justify-content:center;margin-bottom:20px;}
  .profile-note{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .chip-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0;text-align:center;}
  .chip{border-radius:18px;padding:10px 0;background:var(--paper);box-shadow:var(--clay-shadow-sm);}
  .chip-label{font-size:10px;color:var(--ink-soft);}
  .chip-value{font-size:14px;font-weight:600;}

  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* ---- search / discover ---- */
  .search-bar{display:flex;align-items:center;gap:8px;background:var(--paper);border:none;border-bottom:1px solid rgba(163,177,198,.45);border-radius:18px;padding:10px 14px;margin-bottom:16px;color:var(--ink-soft);box-shadow:var(--clay-shadow-press);}
  .search-bar input{flex:1;border:none;outline:none;background:transparent;color:var(--ink);}
  .user-row{display:flex;align-items:center;gap:12px;background:var(--paper);border:none;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--clay-shadow-sm);}
  .user-row-info{flex:1;min-width:0;}
  .user-row-name{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;}
  .user-row-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* ---- blue tick ---- */
  .verified-badge{display:inline-flex;flex-shrink:0;}

  /* ---- follow / block buttons ---- */
  .follow-btn{font-size:12px;font-weight:500;padding:8px 14px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:5px;flex-shrink:0;box-shadow:var(--clay-shadow-navy);}
  .follow-btn.following{background:var(--paper);color:var(--ink);box-shadow:var(--clay-shadow-sm);}
  .follow-btn.requested{background:var(--paper);color:var(--ink-soft);box-shadow:var(--clay-shadow-sm);}
  .request-row-actions{display:flex;gap:8px;flex-shrink:0;}
  .request-row-actions .follow-btn, .request-row-actions .block-btn{padding:8px 12px;}
  .msg-btn{font-size:12px;font-weight:500;padding:8px 12px;border-radius:14px;background:var(--paper);color:var(--ink);display:flex;align-items:center;gap:5px;flex-shrink:0;box-shadow:var(--clay-shadow-sm);}
  .block-btn{font-size:12px;font-weight:500;padding:8px 12px;border-radius:14px;background:#F7E9E9;color:var(--maroon);display:flex;align-items:center;gap:5px;flex-shrink:0;box-shadow:var(--clay-shadow-sm);}

  /* ---- profile view page ---- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back-btn{padding:8px;border-radius:999px;background:var(--paper);color:var(--ink);flex-shrink:0;display:flex;box-shadow:var(--clay-shadow-sm);}
  .stat-row{display:flex;gap:10px;margin:14px 0;}
  .stat-box{flex:1;text-align:center;background:var(--paper);border-radius:18px;padding:10px 0;box-shadow:var(--clay-shadow-sm);}
  .stat-num{font-size:16px;font-weight:600;}
  .stat-label{font-size:10px;color:var(--ink-soft);}
  .action-row{display:flex;gap:8px;margin-top:14px;}
  .action-row .follow-btn, .action-row .msg-btn, .action-row .block-btn{flex:1;justify-content:center;}
  .blocked-note{text-align:center;font-size:12px;color:var(--maroon);background:#F7E9E9;padding:10px;border-radius:16px;margin-top:10px;box-shadow:var(--clay-shadow-press);}

  /* ---- blue tick verification box ---- */
  .verify-box{border:1px dashed #C9BFA0;border-radius:18px;padding:14px;margin:16px 0;box-shadow:var(--clay-shadow-press);}
  .verify-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:10px;color:var(--ink-soft);}
  .verify-status.on{color:var(--navy);}
  .verify-hint{font-size:11px;color:var(--ink-soft);margin-top:8px;line-height:1.4;}

  /* ---- chat ---- */
  .chat-list-row{display:flex;align-items:center;gap:12px;background:var(--paper);border:none;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--clay-shadow-sm);}
  .chat-list-text{flex:1;min-width:0;}
  .chat-list-name{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;}
  .chat-list-preview{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .chat-list-time{font-size:10px;color:var(--ink-soft);flex-shrink:0;}
  .chat-empty{text-align:center;padding:50px 0;font-size:14px;color:var(--ink-soft);}
  .chat-thread{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:320px;}
  .chat-thread-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--paper-deep);margin-bottom:12px;}
  .chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;}
  .chat-bubble{max-width:75%;padding:9px 13px;border-radius:20px;font-size:13px;line-height:1.4;position:relative;}
  .chat-bubble.mine{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px;box-shadow:var(--clay-shadow-navy);}
  .chat-bubble.theirs{align-self:flex-start;background:var(--paper);color:var(--ink);border-bottom-left-radius:6px;box-shadow:var(--clay-shadow-sm);}
  .chat-bubble-time{font-size:9px;opacity:.65;margin-top:4px;display:block;}
  .chat-bubble-del{position:absolute;top:-10px;right:-8px;width:22px;height:22px;border-radius:50%;border:none;background:var(--paper);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:0;transition:opacity .15s;box-shadow:var(--clay-shadow-sm);}
  .chat-bubble-del svg{width:12px;height:12px;}
  .chat-bubble.mine:hover .chat-bubble-del,.chat-bubble.mine:focus-within .chat-bubble-del{opacity:1;}
  @media (hover:none){ .chat-bubble-del{opacity:1;} }
  .chat-input-row{display:flex;gap:8px;margin-top:12px;flex-shrink:0;align-items:center;}
  .chat-input-row input{flex:1;padding:11px 14px;border-radius:999px;border:none;outline:none;box-shadow:var(--clay-shadow-press);}

/* Photos Cloudinary (free, bina billing card ke) par upload hoti hain —
   Cloud name aur unsigned upload preset yahan set hain, ye dono secret
   nahi hote isliye client-side code mein rakhna safe hai. */
const CLOUDINARY_CLOUD_NAME = 'uobyco0m';
const CLOUDINARY_UPLOAD_PRESET = 'Ffcupload';

/* School admin account banane ke liye passcode — sirf school staff ke paas
   hona chahiye. Yeh sirf ek client-side gate hai (real security boundary
   Firestore Rules hain, jo neeche 'validIds' collection ke comments mein
   di gayi hain) — koi bhi jo yeh code jaanta hai admin account bana sakta
   hai, isliye ise sirf trusted staff ke saath share karein. */
const ADMIN_CODE = 'FFC-STAFF-2026';

/* ===== Total user cap (school-scale limit) =====
   Poori website par (student + admin dono milakar) maximum itne hi
   accounts ban sakte hain. Yeh naya signup band karne ke liye hai —
   jo already registered hain unko koi farak nahi padta, wo hamesha
   ki tarah login karte rahenge. Limit badalni ho to bas neeche wala
   number badal dijiye. */
const MAX_TOTAL_USERS = 200;

/* ===== Passing-year auto account close (Part 1 — free, bina card ke) =====
   Sirf Class 12 (final year) students ke liye admin whitelist mein
   "passing year" (jaise 2027, 2028) daala ja sakta hai. Us saal ki is
   neeche di gayi cutoff date (result aane ke baad ka buffer) ke baad,
   jab bhi wo student agli baar app kholega/login karega, uski Firestore
   profile khud-ba-khud delete ho jaayegi — aur maujooda "account nahi
   mila" logic (fetchProfiles mein) use turant logout kar dega. Yeh
   poora kaam client-side hi hota hai, koi paid Firebase feature (Cloud
   Functions/Blaze) ki zaroorat nahi.

   Cutoff badalne ke liye bas neeche wale 2 number badal dijiye —
   MONTH 0-indexed hai (0=Jan ... 6=July). Default: passing year ke
   July month ki 1 tareekh (zyadatar college results May-June tak aa
   jaate hain, isliye July tak sabko kaafi buffer mil jaata hai). */
const PASS_YEAR_CUTOFF_MONTH = 6; // 6 = July
const PASS_YEAR_CUTOFF_DAY = 1;

function isPassYearExpired(passYear){
  const py = parseInt(passYear, 10);
  if (!py) return false;
  const cutoff = new Date(py, PASS_YEAR_CUTOFF_MONTH, PASS_YEAR_CUTOFF_DAY).getTime();
  return Date.now() >= cutoff;
}

/* ===== Daily screen-time limit (students only) =====
   Yeh purely is device/browser ke localStorage mein track hoti hai —
   Firestore mein kuch nahi likha jaata, isliye na koi extra read/write
   cost hai na kisi security-rule ki zaroorat. Matlab: agar student
   phone aur laptop dono se use kare to dono jagah alag-alag 1h30m
   milega (cross-device ek saath track karna Firestore writes maangta,
   jo free plan par mehenga pad sakta tha) — school-scale reminder ke
   liye yeh kaafi hai.
   Limit badalni ho to bas neeche wala minute number badal dijiye. */
const DAILY_USAGE_LIMIT_MINUTES = 90;
let usageTickTimer = null;

function usageStorageKey(){
  return `ffc_usage_${state.session}_${todayStr()}`;
}
function getUsageSeconds(){
  if (!state.session) return 0;
  return parseInt(localStorage.getItem(usageStorageKey()) || '0', 10) || 0;
}
function addUsageSeconds(sec){
  if (!state.session) return 0;
  const next = getUsageSeconds() + sec;
  try { localStorage.setItem(usageStorageKey(), String(next)); } catch(e){}
  return next;
}
function isTimeLimitReached(){
  return getUsageSeconds() >= DAILY_USAGE_LIMIT_MINUTES * 60;
}
/* Har 30 second mein 30 second jod dete hain — sirf jab tab visible ho
   aur session ek student ka ho (admin/staff par yeh limit nahi lagti).
   Tools tab (Calculator, Study Timer, Notes, waghera) is limit se
   EXEMPT hai — wahan koi time count nahi hota, kyunki wo khud padhai
   ke liye tools hain, "distraction" nahi. Sirf jab user Home/Search/
   Chat/Profile/Admin mein ho tab hi count hota hai. */
function usageTick(){
  const me = state.profiles[state.session];
  if (!state.session || !me || me.role !== 'student') return;
  const onToolsNow = state.tab === 'tools' && !state.chatWith && !state.viewingProfile && !state.viewingFollowList;
  if (onToolsNow) return;
  const total = addUsageSeconds(30);
  const wasReached = state.timeLimitReached;
  state.timeLimitReached = total >= DAILY_USAGE_LIMIT_MINUTES * 60;
  if (state.timeLimitReached && !wasReached) render();
}
/* ===== Naam change — mahine mein sirf ek baar (misuse rokne ke liye) =====
   Student ho ya admin, dono ke liye same rule hai: apna display naam
   badalne ke baad, agla change kam se kam 30 din baad hi ho sakta hai.
   Photo ya marksheet kabhi bhi badle ja sakte hain — sirf naam par yeh
   limit hai, taaki koi baar-baar naam badal kar identity confuse na kare. */
const NAME_CHANGE_COOLDOWN_DAYS = 30;
function nameChangeDaysLeft(profile){
  if (!profile || !profile.lastNameChangeAt) return 0;
  const elapsedMs = Date.now() - profile.lastNameChangeAt;
  const cooldownMs = NAME_CHANGE_COOLDOWN_DAYS * 24 * 60 * 60 * 1000;
  if (elapsedMs >= cooldownMs) return 0;
  return Math.ceil((cooldownMs - elapsedMs) / (24 * 60 * 60 * 1000));
}

/* ===== Naam duplicate na ho — poori website par har profile ka naam
   unique hona chahiye (student ho ya admin, koi farak nahi). Signup ke
   waqt aur baad mein naam-change karte waqt dono jagah yeh check hota
   hai. Poori 'profiles' collection fetch karke case-insensitive match
   dekha jaata hai — school-scale app hai isliye yeh chhota-sa extra
   read theek hai (fetchProfiles bhi waise hi poori collection fetch
   karta hai). */
async function nameAlreadyTaken(name, excludeIdCard, strict){
  const target = (name || '').trim().toLowerCase();
  if (!target) return false;
  try {
    const snap = await withAuthRetry(() => db.collection('profiles').get());
    let taken = false;
    snap.forEach(d => {
      if (d.id === excludeIdCard) return;
      const data = d.data() || {};
      if ((data.name || '').trim().toLowerCase() === target) taken = true;
    });
    return taken;
  } catch(e){
    if (strict) throw e; // signup ke waqt: error chhupate nahi, aage propagate karte hain (diagnostics)
    return false; // baaki jagah: check fail ho jaaye to block nahi karte
  }
}

function startUsageTimer(){
  stopUsageTimer();
  if (!state.session) return;
  const me = state.profiles[state.session];
  state.timeLimitReached = me && me.role === 'student' ? isTimeLimitReached() : false;
  usageTickTimer = setInterval(usageTick, 30000);
}
function stopUsageTimer(){
  if (usageTickTimer) clearInterval(usageTickTimer);
  usageTickTimer = null;
}

/* ID card <-> pseudo-email, kyunki Firebase Auth email/password maangta hai */
function emailForId(id){ return id.toLowerCase() + '@ffc-network.app'; }
function idFromEmail(email){ return (email || '').split('@')[0].toUpperCase(); }

function firebaseErrorMessage(err){
  const code = err && err.code || '';
  const map = {
    'auth/invalid-credential': 'ID card or password is incorrect.',
    'auth/wrong-password': 'Password is incorrect.',
    'auth/user-not-found': 'This ID card is not registered. Create a new ID card.',
    'auth/email-already-in-use': 'This ID card is already registered. Please log in.',
    'auth/weak-password': 'Password must be at least 6 characters long.',
    'auth/too-many-requests': 'Too many attempts. Please try again in a little while.',
    'auth/network-request-failed': 'Network problem. Please check your internet connection.',
    'auth/unauthorized-domain': 'This website domain is not authorized in Firebase. Add it under Firebase Console → Authentication → Settings → Authorized domains.',
    'auth/operation-not-allowed': 'The Email/Password sign-in method is not enabled in Firebase Console. Enable it under Authentication → Sign-in method.',
    'permission-denied': 'Firestore permission error. Check Firebase Console → Firestore → Rules.',
    'auth/configuration-not-found': 'Authentication is not set up in Firebase Console. Enable Email/Password under Authentication → Get Started → Sign-in method.',
    'timeout': 'Internet is slow or there is no response from the server. Check your connection and try again.',
  };
  /* Diagnostic step-tag — jab kisi Firestore call ko withStep() se tag
     kiya gaya ho, uska naam error message ke aakhir mein dikha dete hain
     (jaise "[step: user-cap-check]"). Isse pata chal jaata hai ki EXACTLY
     kaunsi request deny hui, generic "Firestore permission error" ki
     jagah — debugging ke liye zaroori, feature/UI par koi asar nahi. */
  const stepTag = err && err.step ? ` [step: ${err.step}]` : '';
  if (map[code]) return map[code] + stepTag;
  const detail = code || (err && err.message) || 'unknown';
  return `Something went wrong (${detail}). Please try again.${stepTag}`;
}

/* Kisi Firestore/Auth call ko ek naam ("step") ke saath tag karta hai,
   taaki agar wo fail ho to error message mein exactly pata chale ki
   kaunsa step tha — sirf diagnostics ke liye, behaviour nahi badalta. */
async function withStep(step, fn){
  try {
    return await fn();
  } catch(err){
    if (err && typeof err === 'object' && !err.step) err.step = step;
    throw err;
  }
}

/* Kabhi-kabhi Firebase call kabhi bhi resolve/reject nahi hoti (bahut slow
   ya band internet par) — usse button hamesha ke liye "busy" reh jaata,
   koi error bhi nahi dikhta. Ye helper ek time-limit laga deta hai taaki
   user ko turant pata chal jaaye. */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(Object.assign(new Error('timeout'), { code: 'timeout' })), ms))
  ]);
}

/* Naya Firebase Auth account banne ke TURANT baad, uska login-token
   Firestore ke internal connection tak pahunchne mein kabhi-kabhi ek
   pal (kuch sau milliseconds) ki der lag jaati hai — chahe humne
   getIdToken(true) se token force-refresh bhi kiya ho. Us chhote se
   gap mein agar koi Firestore call ho jaaye to "permission-denied"
   aa jaata hai, bilkul rules sahi hone ke bawajood. Yeh helper aisi
   calls ko khud-ba-khud, thodi der ruk kar (0.6s, 1.2s, ...), fir se
   try karta hai — sirf 'permission-denied' par retry karta hai, koi
   aur error ho to turant throw kar deta hai. */
function withAuthRetry(fn, retries, baseDelayMs){
  retries = retries || 5;
  baseDelayMs = baseDelayMs || 600;
  return new Promise((resolve, reject) => {
    let attempt = 0;
    function tryOnce(){
      attempt++;
      fn().then(resolve).catch(err => {
        const code = err && err.code;
        if (code === 'permission-denied' && attempt < retries){
          setTimeout(tryOnce, baseDelayMs * attempt);
        } else {
          reject(err);
        }
      });
    }
    tryOnce();
  });
}

let unsubChatList = null, unsubChatMsgs = null;
let profilesRefreshTimer = null, feedRefreshTimer = null;
/* Jab signup (handleCreate) chal raha ho, us poori window mein
   onAuthStateChanged ke through fire hone waala fetchProfiles() ko
   "account nahi mila" maan kar user ko sign-out NAHI karna chahiye —
   kyunki Firebase Auth account create hote hi (Firestore profile document
   banne se PEHLE hi) onAuthStateChanged turant fire ho jaata hai. Bina
   is guard ke, fetchProfiles() beech mein hi galti se signup ko cancel
   kar deta tha ("Aapka account nahi mila... Dobara Sign Up karein"). */
let signupInFlight = false;

/* Profiles aur feed ab poore collection ko HAMESHA real-time sunte nahi
   (pehle onSnapshot poori 'profiles'/'posts' collection par tha — iska
   matlab kahin bhi ek chhota sa update hote hi, wo har connected user ko
   dubara poora bhej diya jaata tha. 800 users ke saath ye Firestore ka
   free daily read-quota minutes mein khatam kar deta). Ab inhe ek baar
   fetch karke, har 45 second mein aur relevant tab khulne par refresh
   kiya jaata hai — data thoda kam "instant" hai lekin read cost bahut
   kam aur predictable rehti hai. */
async function fetchProfiles(){
  try {
    const snap = await db.collection('profiles').get();
    const next = {};
    snap.forEach(d => { next[d.id] = d.data(); });
    state.profiles = next;
    /* Agar humara apna session hai lekin uski profile Firestore mein
       nahi mili (jaise admin ne account delete kar diya, ya data clear
       hua), to app hamesha ke liye "Profile load ho rahi hai…" par atak
       jaata — user ko pata hi nahi chalta kya karein. Isliye yahan check
       karke, khud logout karke ek saaf message ke saath login screen par
       bhej dete hain. */
    /* Apni khud ki profile ka passing-year check — sirf apna account hi
       delete karte hain (kabhi kisi doosre student ka nahi), taaki
       Firestore Security Rules mein "sirf apni hi profile delete kar
       sakta hai" wala restriction bhi lagaya ja sake bina kisi feature
       ke tootne ke. */
    const mine = next[state.session];
    if (state.session && mine && mine.role === 'student' && isPassYearExpired(mine.passYear)){
      try { await db.collection('profiles').doc(state.session).delete(); } catch(e){}
      await auth.signOut();
      state.authError = 'Your passing year is complete, so your account has been closed automatically. Please Sign Up again to start a new session.';
      return render();
    }
    if (state.session && !next[state.session]){
      if (signupInFlight) { render(); return; }
      await auth.signOut();
      state.authError = 'Your account was not found (it may have been deleted or reset). Please Sign Up again.';
      return render();
    }
    if (state.session && mine && mine.role === 'student'){
      state.timeLimitReached = isTimeLimitReached();
    }
    /* Admin ko ek chhoti si 'admins/{uid}' marker doc ke through register
       karte hain (sirf ek baar, khud-ba-khud) — isse Firestore Rules
       admin ko purane/orphan student profiles delete karne ki ijaazat
       de paati hain (jaise koi ID whitelist se hatakar dobara kisi
       naye student ko di jaaye), bina kisi Cloud Function ke. Yeh sirf
       ek marker hai, koi naya UI/feature nahi — isliye purani website
       waisi hi rehti hai. */
    if (state.session && mine && mine.role === 'admin' && !state.adminRegistered){
      state.adminRegistered = true;
      const myUid = auth.currentUser && auth.currentUser.uid;
      if (myUid){
        try { await db.collection('admins').doc(myUid).set({ uid: myUid }, { merge: true }); } catch(e){}
      }
    }
    render();
  } catch(e){}
}
async function fetchFeed(){
  try {
    const snap = await db.collection('posts').orderBy('time', 'desc').limit(100).get();
    state.feed = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    render();
  } catch(e){}
}
/* Online/last-seen ke liye koi naya poll/timer nahi lagaya — sirf jab
   user login karta hai ya tab wapas visible hota hai, tab apni profile
   ka 'lastActive' field ek chhoti si update se refresh kar dete hain.
   Doosre students ka 'lastActive' padhne ke liye bhi koi extra read
   nahi hoti — wo pehle se chal rahe fetchProfiles() cycle (har 3 min /
   visibility par) ke saath hi mil jaata hai. */
async function updateLastActive(){
  if (!state.session) return;
  try { await db.collection('profiles').doc(state.session).update({ lastActive: Date.now() }); } catch(e){}
}

/* School ke official ID card numbers ki whitelist — sirf isi list mein
   maujood number se hi naya student account bana paayega. Signup se
   PEHLE (auth hone se pehle) yeh check hota hai, isliye Firestore Rules
   mein is collection par public read allow karna zaroori hai:

     match /validIds/{idNum} {
       allow read: if true;
       allow write: if request.auth != null;
     }

   (write ko sirf admin account tak seemit karne ke liye asli tarika
   Cloud Functions/custom claims hai — client-side app mein hum sirf
   admin passcode se UI chhupate hain, jo school-scale ke liye kaafi hai
   lekin cryptographically foolproof nahi.) */
async function fetchValidIds(){
  try {
    const snap = await db.collection('validIds').get();
    const next = {};
    snap.forEach(d => { next[d.id] = d.data() || {}; });
    state.validIds = next;
    state.validIdsLoaded = true;
    render();
  } catch(e){}
}
/* Refresh interval ko 45 second se badha kar 3 minute (180000ms) kar diya
   hai — profiles/feed itni tezi se badalte nahi ki har 45 second mein
   poora collection dobara padhna zaroori ho. Isse reads seedha ~4 guna
   kam ho jaati hain.

   Doosra, zyada bada, fix: jab phone ki screen band ho ya user kisi
   doosre app/tab par chala jaaye (background), tab refresh bilkul ROOK
   dete hain — kyunki us waqt user data dekh hi nahi raha, use turant
   update dikhane ki koi zaroorat nahi. Wapas aane par ek turant fresh
   fetch ho jaata hai. Ek college mein 500 students ke saath, zyadatar
   phone zyada waqt background/locked rehte hain — isliye ye do chhote
   fix milkar Firebase ke free daily read-quota ko students ki poori
   sankhya ke saath bhi surakshit rakhte hain, bina kisi feature ko
   hataye. */
function startBackgroundRefresh(){
  stopBackgroundRefresh();
  profilesRefreshTimer = setInterval(fetchProfiles, 600000);
  feedRefreshTimer = setInterval(fetchFeed, 180000);
}
function stopBackgroundRefresh(){
  if (profilesRefreshTimer) clearInterval(profilesRefreshTimer);
  if (feedRefreshTimer) clearInterval(feedRefreshTimer);
  profilesRefreshTimer = null; feedRefreshTimer = null;
}
function handleVisibilityChange(){
  if (!state.session) return;
  if (document.hidden) {
    stopBackgroundRefresh();
    stopUsageTimer();
  } else {
    fetchProfiles();
    fetchFeed();
    updateLastActive();
    startBackgroundRefresh();
    startUsageTimer();
  }
}
document.addEventListener('visibilitychange', handleVisibilityChange);
function subscribeChatList(){
  if (unsubChatList) unsubChatList();
  const myUid = auth.currentUser && auth.currentUser.uid;
  if (!myUid) return;
  /* Note: yahan Firestore query mein 'orderBy' jaanbujh kar nahi lagaya —
     'array-contains' filter ke saath 'orderBy' kisi doosre field par lagane
     ke liye Firestore ko ek composite index chahiye hota hai. Agar wo index
     Firebase console mein bana hi na ho, to ye query hamesha fail hoti hai
     aur chat list hamesha khaali dikhti hai (jabki chats/messages khud theek
     kaam karte hain). Isliye sorting yahan client-side (JS mein) kar rahe
     hain — koi index zaroori nahi rahta aur list hamesha load hoti hai. */
  unsubChatList = db.collection('chats')
    .where('participantUids', 'array-contains', myUid)
    .onSnapshot(snap => {
      state.chatList = snap.docs.map(d => {
        const c = d.data();
        const otherId = (c.participants || []).find(x => x !== state.session);
        return { otherId, lastText: c.lastText || '', lastTime: c.lastTime || 0, lastFrom: c.lastFrom || '' };
      }).sort((a, b) => b.lastTime - a.lastTime);
      render(); /* har tab par bhi call karte hain taaki bottom-nav ka unread badge turant update ho jaaye */
    }, () => { state.chatList = []; });
}
function teardownSubscriptions(){
  stopBackgroundRefresh();
  if (unsubChatList) unsubChatList(); unsubChatList = null;
  if (unsubChatMsgs) unsubChatMsgs(); unsubChatMsgs = null;
}

function esc(str){
  const d = document.createElement('div');
  d.innerText = str == null ? '' : str;
  return d.innerHTML;
}

/* Data-saver mode ON hone par photo turant load nahi hoti — tap karne
   tak sirf ek chhota placeholder dikhta hai (post images aur chat
   images dono ke liye). Off hone par ya ek baar tap karne ke baad,
   normal <img> dikha dete hain. */
function imgHtml(url, cls, alt){
  if (!url) return '';
  if (!state.dataSaver || state.loadedImages.has(url)){
    return `<img class="${cls}" src="${url}" alt="${alt||''}" />`;
  }
  return `<button type="button" class="${cls} data-saver-placeholder" data-act="load-image" data-url="${esc(url)}">${svgIcon('camera')}<span>Tap to view photo</span></button>`;
}

function resizeImage(file, maxDim){
  maxDim = maxDim || 320;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Photo ko resize karke, base64 ki jagah Cloudinary par upload karta hai
   aur uska image URL wapas deta hai. Pehle photos seedhe Firestore document
   ke andar base64 text ki tarah save hoti thi — isse documents bade ho jaate
   the aur har profile/feed read mein woh poora base64 baar-baar transfer hota
   tha (800 users ke scale par bahut mehenga). Ab sirf ek chhota sa URL string
   Firestore mein save hota hai, asli photo Cloudinary (free plan) mein rehti
   hai. `folder`/`uid` params sirf reference ke liye hain, Cloudinary preset
   khud hi apna folder use karta hai. */
/* resourceType 'image' (default, profile/marksheet photos ke liye) ya
   'auto' ho sakta hai — 'auto' Cloudinary ko khud decide karne deta hai
   ki file image hai ya PDF/koi aur document, taaki chat mein PDF bhi
   bheja ja sake. */
async function uploadDataUrl(dataUrl, folder, uid, resourceType){
  if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl; // already a URL ya khaali — kuchh nahi karna
  resourceType = resourceType || 'image';
  const form = new FormData();
  form.append('file', dataUrl);
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`, { method: 'POST', body: form });
  const data = await res.json();
  if (!data.secure_url) throw new Error((data.error && data.error.message) || 'cloudinary-upload-failed');
  return data.secure_url;
}

function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm pehle';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h pehle';
  return Math.floor(h / 24) + 'd pehle';
}

function presenceLabel(profile){
  if (!profile || !profile.lastActive || profile.hideOnlineStatus) return '';
  const diffMin = (Date.now() - profile.lastActive) / 60000;
  if (diffMin < 3) return 'Online';
  return 'Active ' + timeAgo(profile.lastActive);
}

const UNIT_DATA = {
  length: { units: { m:1, km:1000, cm:0.01, mm:0.001, ft:0.3048, inch:0.0254, mile:1609.344 }, labels: { m:'Metre', km:'Kilometre', cm:'Centimetre', mm:'Millimetre', ft:'Foot', inch:'Inch', mile:'Mile' } },
  weight: { units: { kg:1, g:0.001, mg:0.000001, lb:0.45359237, oz:0.0283495 }, labels: { kg:'Kilogram', g:'Gram', mg:'Milligram', lb:'Pound', oz:'Ounce' } },
  temp: { units: { C:1, F:1, K:1 }, labels: { C:'Celsius', F:'Fahrenheit', K:'Kelvin' } },
};
function convertUnit(cat, from, to, val){
  if (isNaN(val)) return null;
  if (cat === 'temp'){
    let c;
    if (from === 'C') c = val; else if (from === 'F') c = (val - 32) * 5/9; else c = val - 273.15;
    if (to === 'C') return c; if (to === 'F') return c * 9/5 + 32; return c + 273.15;
  }
  const u = UNIT_DATA[cat].units;
  return (val * u[from]) / u[to];
}

/* ---- word/character counter ---- */
function countWords(text){
  const trimmed = (text || '').trim();
  if (!trimmed) return { words:0, chars:0, charsNoSpace:0, sentences:0 };
  const words = trimmed.split(/\s+/).filter(Boolean).length;
  const chars = text.length;
  const charsNoSpace = text.replace(/\s/g, '').length;
  const sentences = trimmed.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
  return { words, chars, charsNoSpace, sentences };
}

/* ---- age calculator ---- */
function calcAge(dobStr){
  if (!dobStr) return null;
  const dob = new Date(dobStr + 'T00:00:00');
  const now = new Date();
  if (dob > now) return null;
  let years = now.getFullYear() - dob.getFullYear();
  let months = now.getMonth() - dob.getMonth();
  let days = now.getDate() - dob.getDate();
  if (days < 0){
    months -= 1;
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if (months < 0){ years -= 1; months += 12; }
  const totalDays = Math.floor((now - dob) / (1000*60*60*24));
  return { years, months, days, totalDays };
}

/* ---- random group / name picker ---- */
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function runPicker(){
  const names = (state.groupNamesInput || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (names.length === 0) { state.pickerResult = null; return render(); }
  if (state.pickerMode === 'pick'){
    const idx = Math.floor(Math.random() * names.length);
    state.pickerResult = { type:'pick', name: names[idx] };
  } else {
    const size = Math.max(1, parseInt(state.groupSize, 10) || 4);
    const shuffled = shuffleArray(names);
    const groups = [];
    for (let i = 0; i < shuffled.length; i += size) groups.push(shuffled.slice(i, i + size));
    state.pickerResult = { type:'groups', groups };
  }
  render();
}

function newTypingTest(){
  state.typing = { status:'idle', startTime:0, sample: TYPING_SAMPLES[Math.floor(Math.random()*TYPING_SAMPLES.length)], typed:'', wpm:0, accuracy:0 };
  render();
}
function finishTypingTest(){
  const t = state.typing;
  const elapsedMin = Math.max((Date.now() - t.startTime) / 60000, 1/60);
  const wordCount = t.sample.trim().split(/\s+/).length;
  const wpm = Math.round(wordCount / elapsedMin);
  let correct = 0;
  for (let i = 0; i < t.sample.length && i < t.typed.length; i++) if (t.sample[i] === t.typed[i]) correct++;
  const accuracy = Math.round((correct / t.sample.length) * 100);
  state.typing = { ...t, status:'done', wpm, accuracy };
  render();
}

/* ---- simple stopwatch ---- */
let stopwatchInterval = null;
function startStopwatch(){
  if (state.stopwatch.running) return;
  state.stopwatch.running = true;
  stopwatchInterval = setInterval(() => { state.stopwatch.seconds += 1; render(); }, 1000);
  render();
}
function pauseStopwatch(){
  state.stopwatch.running = false;
  if (stopwatchInterval) { clearInterval(stopwatchInterval); stopwatchInterval = null; }
  render();
}
function resetStopwatch(){
  pauseStopwatch();
  state.stopwatch = { seconds:0, running:false, laps:[] };
  render();
}
function lapStopwatch(){
  state.stopwatch.laps.unshift(state.stopwatch.seconds);
  render();
}
function fmtStopwatch(s){
  const h = Math.floor(s/3600).toString().padStart(2,'0');
  const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return h === '00' ? `${m}:${sec}` : `${h}:${m}:${sec}`;
}

/* ================= render ================= */
const root = document.getElementById('root');

function render(){
  /* root.innerHTML poora replace hota hai har render par — agar user
     kisi text field mein type kar raha ho (jaise post likhna, profile
     naam, search), to naya DOM banne se cursor/focus chala jaata tha.
     Yahan render se pehle focus + cursor position yaad rakh kar,
     render ke baad usi id wale element par wapas laga dete hain. */
  const active = document.activeElement;
  const hadFocus = active && active.id && root.contains(active);
  const focusId = hadFocus ? active.id : null;
  const selStart = hadFocus && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = hadFocus && 'selectionEnd' in active ? active.selectionEnd : null;

  root.innerHTML = state.session ? renderAppShell() : (state.introStep ? renderIntro() : renderAuth());
  bindEvents();

  if (focusId){
    const el = root.querySelector('#' + CSS.escape(focusId));
    if (el){
      el.focus();
      if (selStart !== null && selEnd !== null && 'setSelectionRange' in el){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
}

    .filter(p => p.idCard !== state.session)
    .filter(p => !(p.blocked||[]).includes(state.session))
    .filter(p => !q || p.name.toLowerCase().includes(q) || p.idCard.toLowerCase().includes(q) || String(p.class||'').includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const rows = results.length === 0
    ? `<div class="empty-state">No student found.</div>`
    : results.map(p => {
        const isFollowing = (me.following||[]).includes(p.idCard);
        const isRequested = !isFollowing && (p.followRequests||[]).includes(state.session);
        return `
        <div class="user-row">
          <div class="avatar" style="width:44px;height:44px;cursor:pointer" data-act="open-profile" data-id="${esc(p.idCard)}">${p.photo?`<img src="${p.photo}"/>`:svgIcon('user').replace('currentColor','var(--ink-soft)')}</div>
          <div class="user-row-info" data-act="open-profile" data-id="${esc(p.idCard)}" style="cursor:pointer">
            <div class="user-row-name">${esc(p.name)} ${verifiedBadge(p)}</div>
            <div class="user-row-meta">${esc(p.class) || '—'}${p.section?' · Sec '+esc(p.section):''}${p.subject?' · '+esc(p.subject):''}</div>
          </div>
          <button type="button" class="follow-btn ${isFollowing?'following':(isRequested?'requested':'')}" data-act="toggle-follow" data-id="${esc(p.idCard)}">
            ${isFollowing ? svgIcon('userCheck')+' Following' : (isRequested ? svgIcon('userCheck')+' Requested' : svgIcon('userPlus')+' Follow')}
          </button>
        </div>`;
      }).join('');

  return `
    <div class="search-bar">${svgIcon('search')}<input id="search-input" placeholder="Search by name, class or ID card…" value="${esc(state.searchQuery)}" /></div>
    ${rows}
  `;
}

function renderToolCalc(){
  const c = state.calc;
  let resultHtml = '';
  if (c.mode === 'percent'){
    const obtained = parseFloat(c.obtained), total = parseFloat(c.total);
    if (!isNaN(obtained) && !isNaN(total) && total > 0){
      const pct = (obtained / total) * 100;
      resultHtml = `<div class="tool-result"><div class="tool-result-num">${pct.toFixed(2)}%</div><div class="tool-result-label">Grade: ${calcGrade(pct)}</div></div>`;
    }
  } else if (c.mode === 'cgpa2pct'){
    const cgpa = parseFloat(c.cgpa);
    if (!isNaN(cgpa)){
      const pct = cgpa * 9.5;
      resultHtml = `<div class="tool-result"><div class="tool-result-num">${pct.toFixed(2)}%</div><div class="tool-result-label">CGPA ${cgpa} × 9.5</div></div>`;
    }
  } else {
    const pct = parseFloat(c.percentInput);
    if (!isNaN(pct)){
      const cgpa = pct / 9.5;
      resultHtml = `<div class="tool-result"><div class="tool-result-num">${cgpa.toFixed(2)}</div><div class="tool-result-label">CGPA (${pct}% ÷ 9.5)</div></div>`;
    }
  }
  return `
    <div class="tool-card">
      <div class="tool-card-title">${svgIcon('calc')} GPA / Percentage Calculator</div>
      <div class="tool-card-sub">Everything is calculated instantly on this phone — no data goes anywhere.</div>
      <div class="seg-toggle">
        <button type="button" class="${c.mode==='percent'?'active':''}" data-act="calc-mode" data-val="percent">Marks → %</button>
        <button type="button" class="${c.mode==='cgpa2pct'?'active':''}" data-act="calc-mode" data-val="cgpa2pct">CGPA → %</button>
        <button type="button" class="${c.mode==='pct2cgpa'?'active':''}" data-act="calc-mode" data-val="pct2cgpa">% → CGPA</button>
      </div>
      ${c.mode==='percent' ? `
        <div class="row2">
          <div class="field"><label>Obtained Marks</label><input id="calc-obtained" type="number" inputmode="decimal" placeholder="450" value="${esc(c.obtained)}" /></div>
          <div class="field"><label>Total Marks</label><input id="calc-total" type="number" inputmode="decimal" placeholder="500" value="${esc(c.total)}" /></div>
        </div>` : ''}
      ${c.mode==='cgpa2pct' ? `
        <div class="field"><label>CGPA (0–10)</label><input id="calc-cgpa" type="number" inputmode="decimal" placeholder="8.4" value="${esc(c.cgpa)}" /></div>` : ''}
      ${c.mode==='pct2cgpa' ? `
        <div class="field"><label>Percentage</label><input id="calc-percent" type="number" inputmode="decimal" placeholder="82" value="${esc(c.percentInput)}" /></div>` : ''}
      ${resultHtml}
    </div>`;
}

function renderProfileView(idCard){
  const p = state.profiles[idCard];
  if (!p) return `<div class="empty-state">Profile not found.</div>`;
  if (idCard === state.session){
    return `
    <div class="back-row"><button type="button" class="back-btn" data-act="close-profile">${svgIcon('back')}</button><div style="font-weight:600;font-size:14px">Your profile</div></div>

  const isFollowing = (me.following||[]).includes(p.idCard);

  const isBlocked = (me.blocked||[]).includes(p.idCard);
  const blockedMe = (p.blocked||[]).includes(state.session);
  const userPosts = state.feed.filter(post => post.idCard === p.idCard);

  const isPrivateLocked = p.privateAccount && !isFollowing;

  const postsHtml = isPrivateLocked
    ? `<div class="empty-state">${svgIcon('shield')}<br/>This account is private. Follow to see their posts.</div>`

        ? `<div class="empty-state">No posts yet.</div>`

            return `
            <div class="post-card">
              <div class="post-head">
                <div class="avatar" style="width:34px;height:34px">${p.photo ? `<img src="${p.photo}"/>` : svgIcon('user').replace('currentColor','var(--ink-soft)')}</div>
                <div class="post-headtext">
                  <div class="post-name">${esc(p.name)} ${verifiedBadge(p)}</div>
                  <div class="post-meta">${esc(post.class) || '—'}${post.section?' · Sec '+esc(post.section):''} · ${timeAgo(post.time)}</div>
                </div>
              </div>
              ${post.text ? `<div class="post-text">${esc(post.text)}</div>` : ''}

  return `
    <div class="back-row">
      <button type="button" class="back-btn" data-act="close-profile">${svgIcon('back')}</button>
      <div>
        <div style="font-weight:600;font-size:14px">${esc(p.name)}</div>
        ${presenceLabel(p) ? `<div style="font-size:11px;color:var(--ink-soft)">${esc(presenceLabel(p))}</div>` : ''}
      </div>
    </div>
    <div class="profile-card-wrap">${idCardHTML(p, 'full')}</div>
    <div class="card">
      <div class="stat-row">
        <div class="stat-box" style="cursor:pointer" data-act="open-follow-list" data-id="${esc(p.idCard)}" data-type="followers"><div class="stat-num">${(p.followers||[]).length}</div><div class="stat-label">Followers</div></div>
        <div class="stat-box" style="cursor:pointer" data-act="open-follow-list" data-id="${esc(p.idCard)}" data-type="following"><div class="stat-num">${(p.following||[]).length}</div><div class="stat-label">Following</div></div>
        <div class="stat-box"><div class="stat-num">${myPostsCount}</div><div class="stat-label">Posts</div></div>
      </div>
      ${blockedMe ? `<div class="blocked-note">This student cannot contact you.</div>` : `
      <div class="action-row">
        <button type="button" class="follow-btn ${isFollowing?'following':(isRequested?'requested':'')}" data-act="toggle-follow" data-id="${esc(p.idCard)}">
          ${isFollowing ? svgIcon('userCheck')+' Following' : (isRequested ? svgIcon('userCheck')+' Requested' : svgIcon('userPlus')+' Follow')}
        </button>
        <button type="button" class="msg-btn" data-act="open-chat" data-id="${esc(p.idCard)}">${svgIcon('chatIcon')} Message</button>
        <button type="button" class="block-btn" data-act="toggle-block" data-id="${esc(p.idCard)}">${svgIcon('shield')} ${isBlocked?'Unblock':'Block'}</button>
      </div>`}
    </div>
    ${blockedMe ? '' : `<div style="margin-top:14px">${postsHtml}</div>`}

}

function renderFollowListView(idCard, type){
  const p = state.profiles[idCard];
  if (!p) return `<div class="empty-state">Profile not found.</div>`;
  const me = state.profiles[state.session];
  const isOwner = idCard === state.session;
  const meFollowsThem = (me.following||[]).includes(idCard);
  const title = type === 'followers' ? 'Followers' : 'Following';
  const headerName = isOwner ? 'Your' : `${esc(p.name)}'s`;

  const backRow = `<div class="back-row"><button type="button" class="back-btn" data-act="close-follow-list">${svgIcon('back')}</button><div style="font-weight:600;font-size:14px">${headerName} ${title}</div></div>`;

  /* Private account: sirf owner ya usके followers hi list dekh sakte hain —
     baaki koi bhi ye na dekh paye ki kaun kis private account ko follow karta hai. */
  const locked = p.privateAccount && !isOwner && !meFollowsThem;
  if (locked){
    return `${backRow}<div class="empty-state">${svgIcon('shield')}<br/>This account is private. Follow to see their ${title.toLowerCase()}.</div>`;
  }

  const ids = (type === 'followers' ? p.followers : p.following) || [];
  const list = ids.map(id => state.profiles[id]).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));

  if (list.length === 0){
    return `${backRow}<div class="empty-state">No ${title.toLowerCase()} yet.</div>`;
  }

  const rows = list.map(u => {
    const isFollowing = (me.following||[]).includes(u.idCard);
    const isRequested = !isFollowing && (u.followRequests||[]).includes(state.session);
    const isSelf = u.idCard === state.session;
    return `
    <div class="user-row">
      <div class="avatar" style="width:44px;height:44px;cursor:pointer" data-act="open-profile" data-id="${esc(u.idCard)}">${u.photo?`<img src="${u.photo}"/>`:svgIcon('user').replace('currentColor','var(--ink-soft)')}</div>
      <div class="user-row-info" data-act="open-profile" data-id="${esc(u.idCard)}" style="cursor:pointer">
        <div class="user-row-name">${esc(u.name)} ${verifiedBadge(u)}</div>
        <div class="user-row-meta">${esc(u.class) || '—'}${u.section?' · Sec '+esc(u.section):''}</div>
      </div>
      ${isSelf ? '' : `
      <button type="button" class="follow-btn ${isFollowing?'following':(isRequested?'requested':'')}" data-act="toggle-follow" data-id="${esc(u.idCard)}">
        ${isFollowing ? svgIcon('userCheck')+' Following' : (isRequested ? svgIcon('userCheck')+' Requested' : svgIcon('userPlus')+' Follow')}
      </button>`}
    </div>`;
  }).join('');

  return `${backRow}${rows}`;
}

function renderChatList(){
  const q = (state.chatSearchQuery || '').trim().toLowerCase();
  const searchBar = `<div class="search-bar">${svgIcon('search')}<input id="chat-search-input" placeholder="Search by name in chat…" value="${esc(state.chatSearchQuery)}" /></div>`;

  if (!state.chatList.length){
    return `${searchBar}<div class="chat-empty">No conversations yet.<br/>Search for a student to send a message.</div>`;
  }

  const filtered = !q ? state.chatList : state.chatList.filter(c => {
    const p = state.profiles[c.otherId];
    const name = p ? p.name : (c.otherId || '');
    return name.toLowerCase().includes(q);
  });

  if (!filtered.length){
    return `${searchBar}<div class="chat-empty">No chats found.</div>`;
  }

  const rows = filtered.map(c => {
    /* Pehle yahan profile na milne par (naya user, ya cache abhi refresh
       nahi hua) poori row hi hide ho jaati thi — isliye chat aayi hoti
       thi par dikhti nahi thi. Ab profile na milne par bhi row dikhaate
       hain (naam ki jagah ID), taaki koi bhi chat kabhi gayab na ho. */
    const p = state.profiles[c.otherId];
    const displayName = p ? esc(p.name) : esc(c.otherId || '');
    const avatarInner = p && p.photo ? `<img src="${p.photo}"/>` : svgIcon('user').replace('currentColor','var(--ink-soft)');
    const unread = isChatUnread(c);
    return `
    <div class="chat-list-row">
      <div class="avatar" style="width:44px;height:44px;cursor:pointer" data-act="open-chat" data-id="${esc(c.otherId)}">${avatarInner}</div>
      <div class="chat-list-text" data-act="open-chat" data-id="${esc(c.otherId)}" style="cursor:pointer">
        <div class="chat-list-name">${displayName} ${p?verifiedBadge(p):''}</div>
        <div class="chat-list-preview" style="${unread?'font-weight:600;color:var(--ink)':''}">${state.hidePreview ? 'New message' : esc(c.lastText||'')}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
        <div class="chat-list-time">${timeAgo(c.lastTime)}</div>
        ${unread ? `<span class="unread-dot"></span>` : ''}
      </div>
      <button type="button" class="btn-ghost" data-act="delete-chat" data-id="${esc(c.otherId)}" style="padding:6px 8px;margin-left:6px">${svgIcon('trash')}</button>
    </div>`;
  }).join('');

  return `${searchBar}${rows}`;
}

function renderChatThread(contactId){
  const me = state.profiles[state.session];
  const p = state.profiles[contactId];
  if (!p) return `<div class="empty-state">Profile not found.</div>`;
  const isBlocked = (me.blocked||[]).includes(contactId) || (p.blocked||[]).includes(state.session);

  const bubbles = state.chatMessages.length === 0
    ? `<div class="chat-empty">No messages yet. Say hello to get started!</div>`
    : state.chatMessages.map(m => {
        let inner;
        if (m.attachment && m.attachment.type === 'image'){
          inner = `<a href="${m.attachment.url}" target="_blank" rel="noopener">${imgHtml(m.attachment.url, 'chat-bubble-img', 'Photo')}</a>`;
        } else if (m.attachment && m.attachment.type === 'pdf'){
          inner = `<a class="chat-file-card" href="${m.attachment.url}" target="_blank" rel="noopener">${svgIcon('filePdf')}<span>${esc(m.attachment.name || 'Document.pdf')}</span></a>`;
        } else {
          inner = esc(m.text);
        }
        return `<div class="chat-bubble ${m.from===state.session?'mine':'theirs'} ${m.attachment ? 'has-attachment' : ''}">${inner}<span class="chat-bubble-time">${timeAgo(m.time)}</span>${m.from===state.session && m.id ? `<button type="button" class="chat-bubble-del" data-act="delete-message" data-id="${esc(m.id)}" title="Delete message">${svgIcon('trash')}</button>` : ''}</div>`;
      }).join('');

  return `
    <div class="chat-thread">
      <div class="chat-thread-head">
        <button type="button" class="back-btn" data-act="close-chat">${svgIcon('back')}</button>
        <div class="avatar" style="width:34px;height:34px">${p.photo?`<img src="${p.photo}"/>`:svgIcon('user').replace('currentColor','var(--ink-soft)')}</div>
        <div>
          <div style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px">${esc(p.name)} ${verifiedBadge(p)}</div>
          ${presenceLabel(p) ? `<div style="font-size:11px;color:var(--ink-soft)">${esc(presenceLabel(p))}</div>` : ''}
        </div>
      </div>
      <div class="chat-messages" id="chat-scroll">${bubbles}</div>
      ${state.chatError ? `<div class="blocked-note">${esc(state.chatError)}</div>` : ''}
      ${isBlocked ? `<div class="blocked-note">You cannot send a message — blocked.</div>` : `
      <div class="chat-input-row">
        <button type="button" class="chat-attach-btn" data-act="pick-chat-file" ${state.chatUploading?'disabled':''}>${svgIcon('clip')}</button>
        <input id="chat-file-input" type="file" accept="image/*,application/pdf" hidden />
        <input id="chat-text-input" placeholder="${state.chatUploading ? 'Sending…' : 'Write a message…'}" value="${esc(state.chatText)}" ${state.chatUploading?'disabled':''} />
        <button type="button" class="chat-send-btn" data-act="send-chat" ${state.chatUploading?'disabled':''}>${svgIcon('send')}</button>
      </div>`}
    </div>
  `;
}

function renderHome(){
  const profile = state.profiles[state.session];
  const c = state.composer;
  const visible = state.feed.filter(p => {
    if (state.sectionFilter !== 'all' && p.section !== state.sectionFilter) return false;
    /* Private account: apne posts hamesha khud ko dikhte hain, doosron
       ke posts sirf tabhi dikhte hain jab poster private na ho, ya
       poster ko follow kiya hua ho. */
    if (p.idCard === state.session) return true;
    const posterProfile = state.profiles[p.idCard];
    if (posterProfile && posterProfile.privateAccount && !(posterProfile.followers||[]).includes(state.session)) return false;
    return true;
  });

  const posts = visible.length === 0
    ? `<div class="empty-state">No posts yet. Be the first to share!</div>`
    : visible.map(p => {
        const liked = p.likes.includes(state.session);
        const clickable = p.idCard !== state.session;
        const posterProfile = state.profiles[p.idCard] || p;
        return `
        <div class="post-card">
          <div class="post-head">
            <div class="avatar" style="width:34px;height:34px;${clickable?'cursor:pointer':''}" ${clickable?`data-act="open-profile" data-id="${esc(p.idCard)}"`:''}>${p.photo ? `<img src="${p.photo}"/>` : svgIcon('user').replace('currentColor','var(--ink-soft)')}</div>
            <div class="post-headtext" ${clickable?`data-act="open-profile" data-id="${esc(p.idCard)}" style="cursor:pointer"`:''}>
              <div class="post-name">${esc(p.name)} ${verifiedBadge(posterProfile)}</div>
              <div class="post-meta">${esc(p.class) || '—'}${p.section ? ' · Sec ' + esc(p.section) : ''} · ${timeAgo(p.time)}</div>
            </div>
            ${p.section ? `<span class="section-pill" style="background:${SECTION_COLOR[p.section]||'var(--navy)'}">${esc(p.section)}</span>` : ''}
            ${p.idCard === state.session ? `<button type="button" class="btn-ghost" data-act="delete-post" data-id="${p.id}" style="padding:6px 8px;margin-left:6px">${svgIcon('trash') || 'Delete'}</button>` : ''}
          </div>
          ${p.text ? `<div class="post-text">${esc(p.text)}</div>` : ''}
          ${p.image ? imgHtml(p.image, 'post-image', 'Post image') : ''}
          <button type="button" class="like-btn ${liked?'liked':''}" data-act="like" data-id="${p.id}">
            ${svgIcon('heart').replace('{fill}', liked ? 'currentColor' : 'none')} ${p.likes.length}
          </button>
        </div>`;
      }).join('');

  return `
    <div class="card composer">
      <div class="avatar" style="width:38px;height:38px">${profile.photo ? `<img src="${profile.photo}"/>` : svgIcon('user').replace('currentColor','var(--ink-soft)')}</div>

        ${c.image ? `<div class="composer-preview"><img src="${c.image}"/><button type="button" data-act="clear-image">${svgIcon('x')}</button></div>` : ''}
        ${c.error ? `<div class="blocked-note">${esc(c.error)}</div>` : ''}
        <div class="composer-actions">
          <button type="button" class="photo-btn" data-act="pick-post-photo">${svgIcon('camera')} Photo</button>
          <input id="post-photo-input" type="file" accept="image/*" hidden />
          <button type="button" class="post-btn" data-act="post">Post ${svgIcon('send')}</button>
        </div>
      </div>
    </div>

    <div class="filter-row">
      <button type="button" class="filter-chip ${state.sectionFilter==='all'?'active':''}" data-act="filter" data-val="all">Sab</button>
      <button type="button" class="filter-chip ${state.sectionFilter==='A'?'active':''}" data-act="filter" data-val="A">Section A</button>
      <button type="button" class="filter-chip ${state.sectionFilter==='B'?'active':''}" data-act="filter" data-val="B">Section B</button>
    </div>

    <div>${posts}</div>
  `;
}
