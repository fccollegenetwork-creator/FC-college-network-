<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>FC College Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#101A30;
    --marigold:#E8A33D;
    --maroon:#7A2E2E;
    --sage:#4F7A5C;
    --paper:#F5F4EF;
    --paper-deep:#ECEAE1;
    --ink:#22293A;
    --ink-soft:#5B6478;
  }
  /* ---- dark mode ----
     Sirf CSS variables switch hoti hain (poori file same rehti hai),
     aur ye choice sirf is browser ki "local memory" (localStorage) mein
     save hoti hai — Firebase se koi lena dena nahi, isliye 0% extra load. */
  body.dark-theme{
    --navy:#3A5A9C;
    --navy-deep:#0B1220;
    --marigold:#E8A33D;
    --maroon:#D97878;
    --sage:#7FBF93;
    --paper:#14181F;
    --paper-deep:#1D2330;
    --ink:#E9EAEF;
    --ink-soft:#9AA2B5;
  }
  body.dark-theme .card, body.dark-theme .post-card, body.dark-theme .field input,
  body.dark-theme .field select, body.dark-theme .field textarea,
  body.dark-theme .chip, body.dark-theme .tool-card, body.dark-theme .idcard-qr-box{
    background:var(--paper-deep);
  }
  body.dark-theme header.topbar{background:rgba(20,24,31,.9);}
  body.dark-theme nav.bottombar{background:var(--paper-deep);}
  *{box-sizing:border-box;}
  html{overscroll-behavior-y: contain;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;overscroll-behavior-y: contain;transition:background .2s,color .2s;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  img{display:block;}
  .hidden{display:none !important;}

  /* ---- layout shells ---- */
  #auth-screen{min-height:100vh;display:flex;flex-direction:column;}
  @media(min-width:1024px){ #auth-screen{flex-direction:row;} }
  .brand-panel{
    background:linear-gradient(160deg, var(--navy-deep), var(--navy));
    padding:40px 32px;display:flex;flex-direction:column;justify-content:space-between;
  }
  @media(min-width:1024px){ .brand-panel{width:42%;padding:64px 56px;} }
  .brand-top{display:flex;align-items:center;gap:8px;}
  .brand-title{color:white;font-family:'Zilla Slab',serif;font-size:18px;font-weight:600;}
  .brand-headline{color:white;font-family:'Zilla Slab',serif;font-weight:600;font-size:34px;line-height:1.15;margin:36px 0 12px;max-width:420px;}
  .brand-sub{color:#B9C1D6;max-width:360px;line-height:1.5;}
  .brand-note{display:none;align-items:flex-start;gap:8px;font-size:12px;color:#8A93AC;margin-top:16px;max-width:280px;}
  @media(min-width:1024px){ .brand-note{display:flex;} .brand-card{display:block !important;} }
  .brand-card{display:none;}

  .form-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
  .form-wrap{width:100%;max-width:420px;}

  .tabbar{display:flex;border-radius:999px;padding:4px;background:var(--paper-deep);margin-bottom:28px;}
  .tabbar button{flex:1;padding:10px 0;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-soft);transition:.15s;}
  .tabbar button.active{background:var(--navy);color:#fff;}

  .role-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .role-toggle button{flex:1;padding:9px 0;border-radius:10px;font-size:13px;font-weight:500;border:1px solid var(--paper-deep);color:var(--ink-soft);background:#fff;}
  .role-toggle button.active{border-color:var(--navy);background:var(--navy);color:#fff;}
  .whitelist-badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:999px;flex-shrink:0;}
  .whitelist-badge.used{background:rgba(79,122,92,.15);color:var(--sage);}
  .whitelist-badge.free{background:var(--paper-deep);color:var(--ink-soft);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--paper-deep);background:#fff;color:var(--ink);outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .btn-primary{width:100%;padding:13px 0;border-radius:12px;background:var(--navy);color:#fff;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{padding:9px 16px;border-radius:10px;background:var(--paper-deep);color:var(--ink);font-size:13px;font-weight:500;}
  .error-note{font-size:13px;background:#F7E9E9;color:var(--maroon);padding:10px 12px;border-radius:10px;margin-bottom:14px;}
  .block-note{background:#F7E9E9;border:1px solid var(--maroon);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;color:var(--maroon);font-size:13px;}

  .photo-row{display:flex;align-items:center;gap:12px;}
  .photo-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}

  /* ---- ID card ---- */
  .idcard{position:relative;border-radius:18px;overflow:hidden;font-family:'IBM Plex Mono',monospace;box-shadow:0 12px 30px rgba(0,0,0,.25);}
  .idcard.compact{width:220px;}
  .idcard.full{width:280px;}
  .idcard::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:40px;height:12px;border-radius:999px;background:var(--paper-deep);}
  .idcard-head{padding:22px 16px 10px;display:flex;justify-content:space-between;align-items:center;}
  .idcard-brand{font-size:9px;letter-spacing:.2em;color:var(--marigold);}
  .idcard-sub{font-size:8px;letter-spacing:.05em;color:#C9D0E0;margin-top:2px;}
  .idcard-body{padding:0 16px;display:flex;gap:12px;align-items:center;}
  .idcard-photo{width:64px;height:64px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#2B3B5E;border:2px solid var(--marigold);display:flex;align-items:center;justify-content:center;}
  .idcard-photo img{width:100%;height:100%;object-fit:cover;}
  .idcard-name{color:#fff;font-family:'Zilla Slab',serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idcard-meta{font-size:10px;color:#C9D0E0;margin-top:2px;}
  .idcard-strip{margin-top:14px;padding:8px 16px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:space-between;}
  .idcard-id{font-size:8px;letter-spacing:.15em;color:#8A93AC;}
  .idcard-bars{display:flex;gap:2px;}
  .idcard-bars span{width:2px;background:var(--marigold);opacity:.8;}

  /* ---- app shell ---- */
  #app-shell{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{position:sticky;top:0;z-index:10;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,244,239,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--paper-deep);}
  .topbar-brand{display:flex;align-items:center;gap:8px;font-family:'Zilla Slab',serif;font-weight:600;font-size:14px;color:var(--navy);}
  .logout-btn{font-size:12px;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--paper-deep);color:var(--ink-soft);}

  main{flex:1;padding:20px 16px;}
  nav.bottombar{position:sticky;bottom:0;display:flex;justify-content:space-around;padding:8px 0;background:#fff;border-top:1px solid var(--paper-deep);}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;flex:1;color:var(--ink-soft);}
  .nav-btn.active{color:var(--navy);}
  .nav-btn span{font-size:10px;font-weight:500;}

  /* composer + feed */
  .card{border-radius:16px;background:#fff;border:1px solid var(--paper-deep);padding:16px;}
  .composer{display:flex;gap:12px;}
  .avatar{border-radius:999px;overflow:hidden;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .composer-body{flex:1;}
  .composer textarea{width:100%;border:none;outline:none;resize:none;font-size:14px;color:var(--ink);background:transparent;}
  .composer-preview{position:relative;display:inline-block;margin-top:8px;}
  .composer-preview img{border-radius:10px;max-height:160px;object-fit:cover;}
  .composer-preview button{position:absolute;top:-8px;right:-8px;background:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .photo-btn{font-size:12px;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;background:var(--paper-deep);color:var(--ink-soft);}
  .post-btn{font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;padding:9px 16px;border-radius:8px;background:var(--navy);color:#fff;}

  .filter-row{display:flex;gap:8px;margin:16px 0;}
  .filter-chip{font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px;background:var(--paper-deep);color:var(--ink-soft);}
  .filter-chip.active{background:var(--navy);color:#fff;}

  .empty-state{text-align:center;padding:60px 0;font-size:14px;color:var(--ink-soft);}
  .post-card{border-radius:16px;background:#fff;border:1px solid var(--paper-deep);padding:16px;margin-bottom:12px;}
  .post-head{display:flex;align-items:center;gap:10px;}
  .post-headtext{flex:1;min-width:0;}
  .post-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .post-meta{font-size:11px;color:var(--ink-soft);}
  .section-pill{font-size:10px;font-weight:500;color:#fff;padding:2px 8px;border-radius:999px;flex-shrink:0;}
  .post-text{font-size:14px;margin-top:10px;white-space:pre-wrap;}
  .post-image{border-radius:10px;margin-top:10px;width:100%;object-fit:cover;max-height:280px;}
  .like-btn{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ink-soft);}
  .like-btn.liked{color:var(--maroon);}

  /* profile tab */
  .profile-card-wrap{display:flex;justify-content:center;margin-bottom:20px;}
  .profile-note{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .chip-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0;text-align:center;}
  .chip{border-radius:12px;padding:10px 0;background:var(--paper-deep);}
  .chip-label{font-size:10px;color:var(--ink-soft);}
  .chip-value{font-size:14px;font-weight:600;}

  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}

  /* ---- search / discover ---- */
  .search-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--paper-deep);border-radius:12px;padding:10px 14px;margin-bottom:16px;color:var(--ink-soft);}
  .search-bar input{flex:1;border:none;outline:none;background:transparent;color:var(--ink);}
  .user-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--paper-deep);border-radius:14px;padding:12px;margin-bottom:10px;}
  .user-row-info{flex:1;min-width:0;}
  .user-row-name{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;}
  .user-row-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* ---- blue tick ---- */
  .verified-badge{display:inline-flex;flex-shrink:0;}

  /* ---- follow / block buttons ---- */
  .follow-btn{font-size:12px;font-weight:500;padding:8px 14px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .follow-btn.following{background:var(--paper-deep);color:var(--ink);}
  .msg-btn{font-size:12px;font-weight:500;padding:8px 12px;border-radius:8px;background:var(--paper-deep);color:var(--ink);display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .block-btn{font-size:12px;font-weight:500;padding:8px 12px;border-radius:8px;background:#F7E9E9;color:var(--maroon);display:flex;align-items:center;gap:5px;flex-shrink:0;}

  /* ---- profile view page ---- */
  .back-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .back-btn{padding:8px;border-radius:999px;background:var(--paper-deep);color:var(--ink);flex-shrink:0;display:flex;}
  .stat-row{display:flex;gap:10px;margin:14px 0;}
  .stat-box{flex:1;text-align:center;background:var(--paper-deep);border-radius:12px;padding:10px 0;}
  .stat-num{font-size:16px;font-weight:600;}
  .stat-label{font-size:10px;color:var(--ink-soft);}
  .action-row{display:flex;gap:8px;margin-top:14px;}
  .action-row .follow-btn, .action-row .msg-btn, .action-row .block-btn{flex:1;justify-content:center;}
  .blocked-note{text-align:center;font-size:12px;color:var(--maroon);background:#F7E9E9;padding:10px;border-radius:10px;margin-top:10px;}

  /* ---- blue tick verification box ---- */
  .verify-box{border:1px dashed #C9BFA0;border-radius:12px;padding:14px;margin:16px 0;}
  .verify-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;margin-bottom:10px;color:var(--ink-soft);}
  .verify-status.on{color:var(--navy);}
  .verify-hint{font-size:11px;color:var(--ink-soft);margin-top:8px;line-height:1.4;}

  /* ---- chat ---- */
  .chat-list-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--paper-deep);border-radius:14px;padding:12px;margin-bottom:10px;}
  .chat-list-text{flex:1;min-width:0;}
  .chat-list-name{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;}
  .chat-list-preview{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .chat-list-time{font-size:10px;color:var(--ink-soft);flex-shrink:0;}
  .chat-empty{text-align:center;padding:50px 0;font-size:14px;color:var(--ink-soft);}
  .chat-thread{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:320px;}
  .chat-thread-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--paper-deep);margin-bottom:12px;}
  .chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;}
  .chat-bubble{max-width:75%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4;}
  .chat-bubble.mine{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
  .chat-bubble.theirs{align-self:flex-start;background:var(--paper-deep);color:var(--ink);border-bottom-left-radius:4px;}
  .chat-bubble-time{font-size:9px;opacity:.65;margin-top:4px;display:block;}
  .chat-input-row{display:flex;gap:8px;margin-top:12px;flex-shrink:0;align-items:center;}
  .chat-input-row input{flex:1;padding:11px 14px;border-radius:999px;border:1px solid var(--paper-deep);outline:none;}
  .chat-attach-btn{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1px solid var(--paper-deep);background:#fff;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .chat-attach-btn:disabled{opacity:.5;}
  .chat-bubble-img{max-width:180px;max-height:220px;border-radius:12px;display:block;margin-bottom:4px;}
  .chat-bubble.has-attachment{padding:6px;}
  .chat-file-card{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.5);border-radius:10px;padding:8px 10px;text-decoration:none;color:inherit;font-size:12.5px;max-width:200px;}
  .chat-bubble.mine .chat-file-card{background:rgba(255,255,255,0.2);}
  .chat-file-card span{word-break:break-word;}
  .chat-send-btn{width:42px;height:42px;border-radius:999px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* ---- Tools tab ----
     Neeche ke saare tools (calculator, timer, countdown, QR, notes)
     purely client-side hain — koi Firestore read/write nahi karte. */
  .theme-toggle-btn{width:34px;height:34px;border-radius:999px;background:var(--paper-deep);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .quote-card{border-radius:16px;background:linear-gradient(135deg,var(--navy-deep),var(--navy));padding:16px 18px;color:#fff;margin-bottom:16px;}
  .quote-card .quote-text{font-family:'Zilla Slab',serif;font-size:15px;line-height:1.5;}
  .quote-card .quote-tag{font-size:10px;color:var(--marigold);letter-spacing:.1em;margin-bottom:6px;}
  .tool-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;-ms-overflow-style:none;scrollbar-width:none;}
  .tool-tabs::-webkit-scrollbar{display:none;}
  .tool-tabs button{flex-shrink:0;font-size:12px;font-weight:500;padding:8px 14px;border-radius:999px;background:var(--paper-deep);color:var(--ink-soft);white-space:nowrap;}
  .tool-tabs button.active{background:var(--navy);color:#fff;}
  .tool-card{border-radius:16px;background:#fff;border:1px solid var(--paper-deep);padding:18px;margin-bottom:14px;}
  .tool-card-title{font-family:'Zilla Slab',serif;font-weight:600;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .tool-card-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .tool-result{border-radius:12px;background:var(--paper-deep);padding:14px;text-align:center;margin-top:12px;}
  .tool-result-num{font-family:'Zilla Slab',serif;font-size:26px;font-weight:600;color:var(--navy);}
  .tool-result-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .seg-toggle{display:flex;border-radius:10px;padding:3px;background:var(--paper-deep);margin-bottom:14px;}
  .seg-toggle button{flex:1;padding:8px 0;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink-soft);}
  .seg-toggle button.active{background:var(--navy);color:#fff;}
  .timer-display{font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:500;text-align:center;color:var(--navy);letter-spacing:.03em;margin:10px 0;}
  .timer-mode-label{text-align:center;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;}
  .timer-btn-row{display:flex;gap:10px;margin-top:14px;}
  .timer-btn-row button{flex:1;padding:11px 0;border-radius:12px;font-size:13px;font-weight:500;}
  .timer-btn-row .btn-start{background:var(--navy);color:#fff;}
  .timer-btn-row .btn-reset{background:var(--paper-deep);color:var(--ink);}
  .countdown-num{font-family:'Zilla Slab',serif;font-size:52px;font-weight:700;text-align:center;color:var(--maroon);}
  .countdown-label{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .idcard-qr-box{background:#fff;border-radius:14px;padding:16px;display:flex;justify-content:center;margin:14px 0;}
  .note-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--paper-deep);}
  .note-item:last-child{border-bottom:none;}
  .note-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
  .note-check.done{background:var(--sage);border-color:var(--sage);}
  .note-item-text{flex:1;font-size:13px;word-break:break-word;}
  .note-item-text.done{text-decoration:line-through;color:var(--ink-soft);}
  .note-del{color:var(--ink-soft);flex-shrink:0;}
  .note-add-row{display:flex;gap:8px;margin-top:12px;}
  .note-add-row input{flex:1;}
  .note-add-row button{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* ---- naye 10 tools ki CSS ---- */
  .periodic-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;max-height:320px;overflow-y:auto;}
  .periodic-tile{width:46px;height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1a1a1a;flex-shrink:0;transition:.1s;}
  .periodic-tile-num{font-size:8px;opacity:.7;line-height:1;}
  .periodic-tile-sym{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;line-height:1.2;}

/* Photos Cloudinary (free, bina billing card ke) par upload hoti hain —
   Cloud name aur unsigned upload preset yahan set hain, ye dono secret
   nahi hote isliye client-side code mein rakhna safe hai. */
const CLOUDINARY_CLOUD_NAME = 'uobyco0m';
const CLOUDINARY_UPLOAD_PRESET = 'Ffcupload';

/* School admin account banane ke liye passcode — sirf school staff ke paas
   hona chahiye. Yeh sirf ek client-side gate hai (real security boundary
   Firestore Rules hain, jo neeche 'validIds' collection ke comments mein
   di gayi hain) — koi bhi jo yeh code jaanta hai admin account bana sakta
   hai, isliye ise sirf trusted staff ke saath share karein. */
const ADMIN_CODE = 'FFC-STAFF-2026';

/* ===== Total user cap (school-scale limit) =====
   Poori website par (student + admin dono milakar) maximum itne hi
   accounts ban sakte hain. Yeh naya signup band karne ke liye hai —
   jo already registered hain unko koi farak nahi padta, wo hamesha
   ki tarah login karte rahenge. Limit badalni ho to bas neeche wala
   number badal dijiye. */
const MAX_TOTAL_USERS = 800;

/* ===== Passing-year auto account close (Part 1 — free, bina card ke) =====
   Sirf Class 12 (final year) students ke liye admin whitelist mein
   "passing year" (jaise 2027, 2028) daala ja sakta hai. Us saal ki is
   neeche di gayi cutoff date (result aane ke baad ka buffer) ke baad,
   jab bhi wo student agli baar app kholega/login karega, uski Firestore
   profile khud-ba-khud delete ho jaayegi — aur maujooda "account nahi
   mila" logic (fetchProfiles mein) use turant logout kar dega. Yeh
   poora kaam client-side hi hota hai, koi paid Firebase feature (Cloud
   Functions/Blaze) ki zaroorat nahi.

   Cutoff badalne ke liye bas neeche wale 2 number badal dijiye —
   MONTH 0-indexed hai (0=Jan ... 6=July). Default: passing year ke
   July month ki 1 tareekh (zyadatar college results May-June tak aa
   jaate hain, isliye July tak sabko kaafi buffer mil jaata hai). */
const PASS_YEAR_CUTOFF_MONTH = 6; // 6 = July
const PASS_YEAR_CUTOFF_DAY = 1;

function isPassYearExpired(passYear){
  const py = parseInt(passYear, 10);
  if (!py) return false;
  const cutoff = new Date(py, PASS_YEAR_CUTOFF_MONTH, PASS_YEAR_CUTOFF_DAY).getTime();
  return Date.now() >= cutoff;
}

/* ===== Daily screen-time limit (students only) =====
   Yeh purely is device/browser ke localStorage mein track hoti hai —
   Firestore mein kuch nahi likha jaata, isliye na koi extra read/write
   cost hai na kisi security-rule ki zaroorat. Matlab: agar student
   phone aur laptop dono se use kare to dono jagah alag-alag 1h30m
   milega (cross-device ek saath track karna Firestore writes maangta,
   jo free plan par mehenga pad sakta tha) — school-scale reminder ke
   liye yeh kaafi hai.
   Limit badalni ho to bas neeche wala minute number badal dijiye. */
const DAILY_USAGE_LIMIT_MINUTES = 90;
let usageTickTimer = null;

function usageStorageKey(){
  return `ffc_usage_${state.session}_${todayStr()}`;
}
function getUsageSeconds(){
  if (!state.session) return 0;
  return parseInt(localStorage.getItem(usageStorageKey()) || '0', 10) || 0;
}
function addUsageSeconds(sec){
  if (!state.session) return 0;
  const next = getUsageSeconds() + sec;
  try { localStorage.setItem(usageStorageKey(), String(next)); } catch(e){}
  return next;
}
function isTimeLimitReached(){
  return getUsageSeconds() >= DAILY_USAGE_LIMIT_MINUTES * 60;
}
/* Har 30 second mein 30 second jod dete hain — sirf jab tab visible ho
   aur session ek student ka ho (admin/staff par yeh limit nahi lagti).
   Tools tab (Calculator, Study Timer, Notes, waghera) is limit se
   EXEMPT hai — wahan koi time count nahi hota, kyunki wo khud padhai
   ke liye tools hain, "distraction" nahi. Sirf jab user Home/Search/
   Chat/Profile/Admin mein ho tab hi count hota hai. */
function usageTick(){
  const me = state.profiles[state.session];
  if (!state.session || !me || me.role !== 'student') return;
  const onToolsNow = state.tab === 'tools' && !state.chatWith && !state.viewingProfile;
  if (onToolsNow) return;
  const total = addUsageSeconds(30);
  const wasReached = state.timeLimitReached;
  state.timeLimitReached = total >= DAILY_USAGE_LIMIT_MINUTES * 60;
  if (state.timeLimitReached && !wasReached) render();
}
/* ===== Naam change — mahine mein sirf ek baar (misuse rokne ke liye) =====
   Student ho ya admin, dono ke liye same rule hai: apna display naam
   badalne ke baad, agla change kam se kam 30 din baad hi ho sakta hai.
   Photo ya marksheet kabhi bhi badle ja sakte hain — sirf naam par yeh
   limit hai, taaki koi baar-baar naam badal kar identity confuse na kare. */
const NAME_CHANGE_COOLDOWN_DAYS = 30;
function nameChangeDaysLeft(profile){
  if (!profile || !profile.lastNameChangeAt) return 0;
  const elapsedMs = Date.now() - profile.lastNameChangeAt;
  const cooldownMs = NAME_CHANGE_COOLDOWN_DAYS * 24 * 60 * 60 * 1000;
  if (elapsedMs >= cooldownMs) return 0;
  return Math.ceil((cooldownMs - elapsedMs) / (24 * 60 * 60 * 1000));
}

/* ===== Naam duplicate na ho — poori website par har profile ka naam
   unique hona chahiye (student ho ya admin, koi farak nahi). Signup ke
   waqt aur baad mein naam-change karte waqt dono jagah yeh check hota
   hai. Poori 'profiles' collection fetch karke case-insensitive match
   dekha jaata hai — school-scale app hai isliye yeh chhota-sa extra
   read theek hai (fetchProfiles bhi waise hi poori collection fetch
   karta hai). */
async function nameAlreadyTaken(name, excludeIdCard){
  const target = (name || '').trim().toLowerCase();
  if (!target) return false;
  try {
    const snap = await db.collection('profiles').get();
    let taken = false;
    snap.forEach(d => {
      if (d.id === excludeIdCard) return;
      const data = d.data() || {};
      if ((data.name || '').trim().toLowerCase() === target) taken = true;
    });
    return taken;
  } catch(e){
    return false; // check fail ho jaaye to signup/change ko block nahi karte
  }
}

function startUsageTimer(){
  stopUsageTimer();
  if (!state.session) return;
  const me = state.profiles[state.session];
  state.timeLimitReached = me && me.role === 'student' ? isTimeLimitReached() : false;
  usageTickTimer = setInterval(usageTick, 30000);
}
function stopUsageTimer(){
  if (usageTickTimer) clearInterval(usageTickTimer);
  usageTickTimer = null;
}

/* ID card <-> pseudo-email, kyunki Firebase Auth email/password maangta hai */
function emailForId(id){ return id.toLowerCase() + '@ffc-network.app'; }
function idFromEmail(email){ return (email || '').split('@')[0].toUpperCase(); }

function firebaseErrorMessage(err){
  const code = err && err.code || '';
  const map = {
    'auth/invalid-credential': 'ID card ya password galat hai.',
    'auth/wrong-password': 'Password galat hai.',
    'auth/user-not-found': 'Yeh ID card register nahi hai. Naya ID card banaayein.',
    'auth/email-already-in-use': 'Yeh ID card pehle se registered hai. Login karein.',
    'auth/weak-password': 'Password kam se kam 6 character ka hona chahiye.',
    'auth/too-many-requests': 'Bahut zyada attempts ho gaye. Thodi der baad try karein.',
    'auth/network-request-failed': 'Network problem. Internet check karein.',
    'auth/unauthorized-domain': 'Yeh website domain Firebase mein authorize nahi hai. Firebase Console → Authentication → Settings → Authorized domains mein isse add karein.',
    'auth/operation-not-allowed': 'Firebase Console mein Email/Password sign-in method enable nahi hai. Authentication → Sign-in method mein ise enable karein.',
    'permission-denied': 'Firestore permission error. Firebase Console → Firestore → Rules check karein.',
    'auth/configuration-not-found': 'Firebase Console mein Authentication set up nahi hai. Authentication → Get Started → Sign-in method mein Email/Password enable karein.',
    'timeout': 'Internet slow hai ya server se response nahi mil raha. Connection check karke dobara try karein.',
  };
  if (map[code]) return map[code];
  const detail = code || (err && err.message) || 'unknown';
  return `Kuch galat ho gaya (${detail}). Dobara try karein.`;
}

/* Kabhi-kabhi Firebase call kabhi bhi resolve/reject nahi hoti (bahut slow
   ya band internet par) — usse button hamesha ke liye "busy" reh jaata,
   koi error bhi nahi dikhta. Ye helper ek time-limit laga deta hai taaki
   user ko turant pata chal jaaye. */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(Object.assign(new Error('timeout'), { code: 'timeout' })), ms))
  ]);
}

let unsubChatList = null, unsubChatMsgs = null;
let profilesRefreshTimer = null, feedRefreshTimer = null;

/* Profiles aur feed ab poore collection ko HAMESHA real-time sunte nahi
   (pehle onSnapshot poori 'profiles'/'posts' collection par tha — iska
   matlab kahin bhi ek chhota sa update hote hi, wo har connected user ko
   dubara poora bhej diya jaata tha. 800 users ke saath ye Firestore ka
   free daily read-quota minutes mein khatam kar deta). Ab inhe ek baar
   fetch karke, har 45 second mein aur relevant tab khulne par refresh
   kiya jaata hai — data thoda kam "instant" hai lekin read cost bahut
   kam aur predictable rehti hai. */
async function fetchProfiles(){
  try {
    const snap = await db.collection('profiles').get();
    const next = {};
    snap.forEach(d => { next[d.id] = d.data(); });
    state.profiles = next;
    /* Agar humara apna session hai lekin uski profile Firestore mein
       nahi mili (jaise admin ne account delete kar diya, ya data clear
       hua), to app hamesha ke liye "Profile load ho rahi hai…" par atak
       jaata — user ko pata hi nahi chalta kya karein. Isliye yahan check
       karke, khud logout karke ek saaf message ke saath login screen par
       bhej dete hain. */
    /* Apni khud ki profile ka passing-year check — sirf apna account hi
       delete karte hain (kabhi kisi doosre student ka nahi), taaki
       Firestore Security Rules mein "sirf apni hi profile delete kar
       sakta hai" wala restriction bhi lagaya ja sake bina kisi feature
       ke tootne ke. */
    const mine = next[state.session];
    if (state.session && mine && mine.role === 'student' && isPassYearExpired(mine.passYear)){
      try { await db.collection('profiles').doc(state.session).delete(); } catch(e){}
      await auth.signOut();
      state.authError = 'Aapka passing year complete ho chuka hai, isliye account automatically band ho gaya hai. Naya session shuru karne ke liye dobara Sign Up karein.';
      return render();
    }
    if (state.session && !next[state.session]){
      await auth.signOut();
      state.authError = 'Aapka account nahi mila (delete ho gaya hai ya reset hua hai). Dobara Sign Up karein.';
      return render();
    }
    if (state.session && mine && mine.role === 'student'){
      state.timeLimitReached = isTimeLimitReached();
    }
    /* Admin ko ek chhoti si 'admins/{uid}' marker doc ke through register
       karte hain (sirf ek baar, khud-ba-khud) — isse Firestore Rules
       admin ko purane/orphan student profiles delete karne ki ijaazat
       de paati hain (jaise koi ID whitelist se hatakar dobara kisi
       naye student ko di jaaye), bina kisi Cloud Function ke. Yeh sirf
       ek marker hai, koi naya UI/feature nahi — isliye purani website
       waisi hi rehti hai. */
    if (state.session && mine && mine.role === 'admin' && !state.adminRegistered){
      state.adminRegistered = true;
      const myUid = auth.currentUser && auth.currentUser.uid;
      if (myUid){
        try { await db.collection('admins').doc(myUid).set({ uid: myUid }, { merge: true }); } catch(e){}
      }
    }
    render();
  } catch(e){}
}
async function fetchFeed(){
  try {
    const snap = await db.collection('posts').orderBy('time', 'desc').limit(100).get();
    state.feed = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    render();
  } catch(e){}
}

/* School ke official ID card numbers ki whitelist — sirf isi list mein
   maujood number se hi naya student account bana paayega. Signup se
   PEHLE (auth hone se pehle) yeh check hota hai, isliye Firestore Rules
   mein is collection par public read allow karna zaroori hai:

     match /validIds/{idNum} {
       allow read: if true;
       allow write: if request.auth != null;
     }

   (write ko sirf admin account tak seemit karne ke liye asli tarika
   Cloud Functions/custom claims hai — client-side app mein hum sirf
   admin passcode se UI chhupate hain, jo school-scale ke liye kaafi hai
   lekin cryptographically foolproof nahi.) */
async function fetchValidIds(){
  try {
    const snap = await db.collection('validIds').get();
    const next = {};
    snap.forEach(d => { next[d.id] = d.data() || {}; });
    state.validIds = next;
    state.validIdsLoaded = true;
    render();
  } catch(e){}
}
/* Refresh interval ko 45 second se badha kar 3 minute (180000ms) kar diya
   hai — profiles/feed itni tezi se badalte nahi ki har 45 second mein
   poora collection dobara padhna zaroori ho. Isse reads seedha ~4 guna
   kam ho jaati hain.

   Doosra, zyada bada, fix: jab phone ki screen band ho ya user kisi
   doosre app/tab par chala jaaye (background), tab refresh bilkul ROOK
   dete hain — kyunki us waqt user data dekh hi nahi raha, use turant
   update dikhane ki koi zaroorat nahi. Wapas aane par ek turant fresh
   fetch ho jaata hai. Ek college mein 500 students ke saath, zyadatar
   phone zyada waqt background/locked rehte hain — isliye ye do chhote
   fix milkar Firebase ke free daily read-quota ko students ki poori
   sankhya ke saath bhi surakshit rakhte hain, bina kisi feature ko
   hataye. */
function startBackgroundRefresh(){
  stopBackgroundRefresh();
  profilesRefreshTimer = setInterval(fetchProfiles, 180000);
  feedRefreshTimer = setInterval(fetchFeed, 180000);
}
function stopBackgroundRefresh(){
  if (profilesRefreshTimer) clearInterval(profilesRefreshTimer);
  if (feedRefreshTimer) clearInterval(feedRefreshTimer);
  profilesRefreshTimer = null; feedRefreshTimer = null;
}
function handleVisibilityChange(){
  if (!state.session) return;
  if (document.hidden) {
    stopBackgroundRefresh();
    stopUsageTimer();
  } else {
    fetchProfiles();
    fetchFeed();
    startBackgroundRefresh();
    startUsageTimer();
  }
}
document.addEventListener('visibilitychange', handleVisibilityChange);
function subscribeChatList(){
  if (unsubChatList) unsubChatList();
  const myUid = auth.currentUser && auth.currentUser.uid;
  if (!myUid) return;
  unsubChatList = db.collection('chats')
    .where('participantUids', 'array-contains', myUid)
    .orderBy('lastTime', 'desc')
    .onSnapshot(snap => {
      state.chatList = snap.docs.map(d => {
        const c = d.data();
        const otherId = (c.participants || []).find(x => x !== state.session);
        return { otherId, lastText: c.lastText || '', lastTime: c.lastTime || 0 };
      });
      if (state.tab === 'chat' && !state.chatWith && !state.viewingProfile) render();
    }, () => { state.chatList = []; });
}
function teardownSubscriptions(){
  stopBackgroundRefresh();
  if (unsubChatList) unsubChatList(); unsubChatList = null;
  if (unsubChatMsgs) unsubChatMsgs(); unsubChatMsgs = null;
}

function esc(str){
  const d = document.createElement('div');
  d.innerText = str == null ? '' : str;
  return d.innerHTML;
}

function resizeImage(file, maxDim){
  maxDim = maxDim || 320;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Photo ko resize karke, base64 ki jagah Cloudinary par upload karta hai
   aur uska image URL wapas deta hai. Pehle photos seedhe Firestore document
   ke andar base64 text ki tarah save hoti thi — isse documents bade ho jaate
   the aur har profile/feed read mein woh poora base64 baar-baar transfer hota
   tha (800 users ke scale par bahut mehenga). Ab sirf ek chhota sa URL string
   Firestore mein save hota hai, asli photo Cloudinary (free plan) mein rehti
   hai. `folder`/`uid` params sirf reference ke liye hain, Cloudinary preset
   khud hi apna folder use karta hai. */
/* resourceType 'image' (default, profile/marksheet photos ke liye) ya
   'auto' ho sakta hai — 'auto' Cloudinary ko khud decide karne deta hai
   ki file image hai ya PDF/koi aur document, taaki chat mein PDF bhi
   bheja ja sake. */
async function uploadDataUrl(dataUrl, folder, uid, resourceType){
  if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl; // already a URL ya khaali — kuchh nahi karna
  resourceType = resourceType || 'image';
  const form = new FormData();
  form.append('file', dataUrl);
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`, { method: 'POST', body: form });
  const data = await res.json();
  if (!data.secure_url) throw new Error((data.error && data.error.message) || 'cloudinary-upload-failed');
  return data.secure_url;
}

function timeAgo(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'abhi';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm pehle';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h pehle';
  return Math.floor(h / 24) + 'd pehle';
}

/* ID card must be the school's real "S R No." — a plain number only,
   jaise 11851 (card par dikhne wala S R No.). Koi bhi letter, dash ya
   space allowed nahi hai — sirf 3 se 6 digit ka number. */
function parseIdCard(id){
  const trimmed = (id || '').trim();
  const m = /^\d{3,6}$/.exec(trimmed);
  if (!m) return null;
  return { num: trimmed };
}

/* GPA/percentage calculator ke teeno mode — sab turant client-side JS
   se calculate hote hain, koi network call nahi. */
function calcGrade(pct){
  if (pct >= 90) return 'A1';
  if (pct >= 80) return 'A2';
  if (pct >= 70) return 'B1';
  if (pct >= 60) return 'B2';
  if (pct >= 50) return 'C1';
  if (pct >= 40) return 'C2';
  return 'D';
}

/* ---- study timer (Pomodoro) ---- */
let timerInterval = null;
function startTimer(){
  if (state.timer.running) return;
  state.timer.running = true;
  timerInterval = setInterval(() => {
    if (state.timer.seconds <= 0){
      state.timer.mode = state.timer.mode === 'focus' ? 'break' : 'focus';
      state.timer.seconds = state.timer.mode === 'focus' ? 25 * 60 : 5 * 60;
    } else {
      state.timer.seconds -= 1;
    }
    render();
  }, 1000);
  render();
}
function pauseTimer(){
  state.timer.running = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  render();
}
function resetTimer(){
  pauseTimer();
  state.timer.mode = 'focus';
  state.timer.seconds = 25 * 60;
  render();
}
function fmtTime(s){
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function daysLeft(dateStr){
  if (!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

/* ---- unit converter — sab kuch client-side maths, koi network nahi ---- */
const UNIT_DATA = {
  length: { units: { m:1, km:1000, cm:0.01, mm:0.001, ft:0.3048, inch:0.0254, mile:1609.344 }, labels: { m:'Metre', km:'Kilometre', cm:'Centimetre', mm:'Millimetre', ft:'Foot', inch:'Inch', mile:'Mile' } },
  weight: { units: { kg:1, g:0.001, mg:0.000001, lb:0.45359237, oz:0.0283495 }, labels: { kg:'Kilogram', g:'Gram', mg:'Milligram', lb:'Pound', oz:'Ounce' } },
  temp: { units: { C:1, F:1, K:1 }, labels: { C:'Celsius', F:'Fahrenheit', K:'Kelvin' } },
};
function convertUnit(cat, from, to, val){
  if (isNaN(val)) return null;
  if (cat === 'temp'){
    let c;
    if (from === 'C') c = val; else if (from === 'F') c = (val - 32) * 5/9; else c = val - 273.15;
    if (to === 'C') return c; if (to === 'F') return c * 9/5 + 32; return c + 273.15;
  }
  const u = UNIT_DATA[cat].units;
  return (val * u[from]) / u[to];
}

/* ---- word/character counter ---- */
function countWords(text){
  const trimmed = (text || '').trim();
  if (!trimmed) return { words:0, chars:0, charsNoSpace:0, sentences:0 };
  const words = trimmed.split(/\s+/).filter(Boolean).length;
  const chars = text.length;
  const charsNoSpace = text.replace(/\s/g, '').length;
  const sentences = trimmed.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
  return { words, chars, charsNoSpace, sentences };
}

/* ---- age calculator ---- */
function calcAge(dobStr){
  if (!dobStr) return null;
  const dob = new Date(dobStr + 'T00:00:00');
  const now = new Date();
  if (dob > now) return null;
  let years = now.getFullYear() - dob.getFullYear();
  let months = now.getMonth() - dob.getMonth();
  let days = now.getDate() - dob.getDate();
  if (days < 0){
    months -= 1;
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if (months < 0){ years -= 1; months += 12; }
  const totalDays = Math.floor((now - dob) / (1000*60*60*24));
  return { years, months, days, totalDays };
}

/* ---- random group / name picker ---- */
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function runPicker(){
  const names = (state.groupNamesInput || '').split('\n').map(s => s.trim()).filter(Boolean);
  if (names.length === 0) { state.pickerResult = null; return render(); }
  if (state.pickerMode === 'pick'){
    const idx = Math.floor(Math.random() * names.length);
    state.pickerResult = { type:'pick', name: names[idx] };
  } else {
    const size = Math.max(1, parseInt(state.groupSize, 10) || 4);
    const shuffled = shuffleArray(names);
    const groups = [];
    for (let i = 0; i < shuffled.length; i += size) groups.push(shuffled.slice(i, i + size));
    state.pickerResult = { type:'groups', groups };
  }
  render();
}

function newTypingTest(){

  render();
}
function finishTypingTest(){
  const t = state.typing;
  const elapsedMin = Math.max((Date.now() - t.startTime) / 60000, 1/60);
  const wordCount = t.sample.trim().split(/\s+/).length;
  const wpm = Math.round(wordCount / elapsedMin);
  let correct = 0;
  for (let i = 0; i < t.sample.length && i < t.typed.length; i++) if (t.sample[i] === t.typed[i]) correct++;
  const accuracy = Math.round((correct / t.sample.length) * 100);
  state.typing = { ...t, status:'done', wpm, accuracy };
  render();
}

}

  state.stopwatch = { seconds:0, running:false, laps:[] };
  render();
}
function lapStopwatch(){
  state.stopwatch.laps.unshift(state.stopwatch.seconds);

function fmtStopwatch(s){
  const h = Math.floor(s/3600).toString().padStart(2,'0');
  const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return h === '00' ? `${m}:${sec}` : `${h}:${m}:${sec}`;
}

function render(){

     kisi text field mein type kar raha ho (jaise post likhna, profile
     naam, search), to naya DOM banne se cursor/focus chala jaata tha.
     Yahan render se pehle focus + cursor position yaad rakh kar,
     render ke baad usi id wale element par wapas laga dete hain. */
  const active = document.activeElement;
  const hadFocus = active && active.id && root.contains(active);
  const focusId = hadFocus ? active.id : null;
  const selStart = hadFocus && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = hadFocus && 'selectionEnd' in active ? active.selectionEnd : null;

  root.innerHTML = state.session ? renderAppShell() : renderAuth();
  bindEvents();

  if (focusId){
    const el = root.querySelector('#' + CSS.escape(focusId));
    if (el){
      el.focus();
      if (selStart !== null && selEnd !== null && 'setSelectionRange' in el){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
}

function renderSearch(){
  const me = state.profiles[state.session];
  const q = (state.searchQuery || '').trim().toLowerCase();
  const results = Object.values(state.profiles)
    .filter(p => p.idCard !== state.session)
    .filter(p => !(me.blocked||[]).includes(p.idCard) && !(p.blocked||[]).includes(state.session))
    .filter(p => !q || p.name.toLowerCase().includes(q) || p.idCard.toLowerCase().includes(q) || String(p.class||'').includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const rows = results.length === 0
    ? `<div class="empty-state">Koi student nahi mila.</div>`
    : results.map(p => {
        const isFollowing = (me.following||[]).includes(p.idCard);
        return `
        <div class="user-row">
          <div class="avatar" style="width:44px;height:44px;cursor:pointer" data-act="open-profile" data-id="${esc(p.idCard)}">${p.photo?`<img src="${p.photo}"/>`:svgIcon('user').replace('currentColor','var(--ink-soft)')}</div>
          <div class="user-row-info" data-act="open-profile" data-id="${esc(p.idCard)}" style="cursor:pointer">
            <div class="user-row-name">${esc(p.name)} ${verifiedBadge(p)}</div>
            <div class="user-row-meta">Class ${esc(p.class)} · Sec ${esc(p.section)}${p.subject?' · '+esc(p.subject):''}</div>
          </div>
          <button type="button" class="follow-btn ${isFollowing?'following':''}" data-act="toggle-follow" data-id="${esc(p.idCard)}">
            ${isFollowing ? svgIcon('userCheck')+' Following' : svgIcon('userPlus')+' Follow'}
          </button>
        </div>`;
      }).join('');

  return `
    <div class="search-bar">${svgIcon('search')}<input id="search-input" placeholder="Naam, class ya ID card se search karein…" value="${esc(state.searchQuery)}" /></div>
    ${rows}
  `;
}

function renderToolCalc(){
  const c = state.calc;
  let resultHtml = '';
  if (c.mode === 'percent'){
    const obtained = parseFloat(c.obtained), total = parseFloat(c.total);
    if (!isNaN(obtained) && !isNaN(total) && total > 0){
      const pct = (obtained / total) * 100;
      resultHtml = `<div class="tool-result"><div class="tool-result-num">${pct.toFixed(2)}%</div><div class="tool-result-label">Grade: ${calcGrade(pct)}</div></div>`;
    }
  } else if (c.mode === 'cgpa2pct'){
    const cgpa = parseFloat(c.cgpa);
    if (!isNaN(cgpa)){
      const pct = cgpa * 9.5;
      resultHtml = `<div class="tool-result"><div class="tool-result-num">${pct.toFixed(2)}%</div><div class="tool-result-label">CGPA ${cgpa} × 9.5</div></div>`;
    }
  } else {
    const pct = parseFloat(c.percentInput);
    if (!isNaN(pct)){
      const cgpa = pct / 9.5;
      resultHtml = `<div class="tool-result"><div class="tool-result-num">${cgpa.toFixed(2)}</div><div class="tool-result-label">CGPA (${pct}% ÷ 9.5)</div></div>`;
    }
  }
  return `
    <div class="tool-card">
      <div class="tool-card-title">${svgIcon('calc')} GPA / Percentage Calculator</div>
      <div class="tool-card-sub">Sab kuch turant, isi phone mein calculate hota hai — koi data kahin nahi jaata.</div>
      <div class="seg-toggle">
        <button type="button" class="${c.mode==='percent'?'active':''}" data-act="calc-mode" data-val="percent">Marks → %</button>
        <button type="button" class="${c.mode==='cgpa2pct'?'active':''}" data-act="calc-mode" data-val="cgpa2pct">CGPA → %</button>
        <button type="button" class="${c.mode==='pct2cgpa'?'active':''}" data-act="calc-mode" data-val="pct2cgpa">% → CGPA</button>
      </div>
      ${c.mode==='percent' ? `
        <div class="row2">
          <div class="field"><label>Obtained Marks</label><input id="calc-obtained" type="number" inputmode="decimal" placeholder="450" value="${esc(c.obtained)}" /></div>
          <div class="field"><label>Total Marks</label><input id="calc-total" type="number" inputmode="decimal" placeholder="500" value="${esc(c.total)}" /></div>
        </div>` : ''}
      ${c.mode==='cgpa2pct' ? `
        <div class="field"><label>CGPA (0–10)</label><input id="calc-cgpa" type="number" inputmode="decimal" placeholder="8.4" value="${esc(c.cgpa)}" /></div>` : ''}
      ${c.mode==='pct2cgpa' ? `
        <div class="field"><label>Percentage</label><input id="calc-percent" type="number" inputmode="decimal" placeholder="82" value="${esc(c.percentInput)}" /></div>` : ''}
      ${resultHtml}
    </div>`;
}

        let cls = '';
        if (i < t.typed.length) cls = t.typed[i] === ch ? 'ok' : 'bad';
        return `<span class="${cls}">${esc(ch)}</span>`;
      }).join('')}</div>
      <div class="field"><textarea id="typing-input" rows="3" placeholder="Yahan type karna shuru karein…" ${t.status==='done'?'disabled':''}>${esc(t.typed)}</textarea></div>
      <div class="timer-btn-row">
        ${t.status!=='done' ? `<button type="button" class="btn-start" data-act="typing-finish">Finish</button>` : ''}
        <button type="button" class="btn-reset" data-act="typing-reset">Naya Test</button>
      </div>
      ${t.status==='done' ? `
        <div class="tool-result">
          <div class="tool-result-num">${t.wpm} WPM</div>
          <div class="tool-result-label">Accuracy: ${t.accuracy}%</div>
        </div>` : ''}
    </div>`;
}

function renderChatThread(contactId){

  if (!p) return `<div class="empty-state">Profile nahi mila.</div>`;

  const bubbles = state.chatMessages.length === 0
    ? `<div class="chat-empty">Abhi koi message nahi. Hello bolke shuru karein!</div>`
    : state.chatMessages.map(m => {
        let inner;
        if (m.attachment && m.attachment.type === 'image'){
          inner = `<a href="${m.attachment.url}" target="_blank" rel="noopener"><img class="chat-bubble-img" src="${m.attachment.url}" alt="Photo" /></a>`;

          inner = `<a class="chat-file-card" href="${m.attachment.url}" target="_blank" rel="noopener">${svgIcon('filePdf')}<span>${esc(m.attachment.name || 'Document.pdf')}</span></a>`;
        } else {
          inner = esc(m.text);

        return `<div class="chat-bubble ${m.from===state.session?'mine':'theirs'} ${m.attachment ? 'has-attachment' : ''}">${inner}<span class="chat-bubble-time">${timeAgo(m.time)}</span></div>`;

  return `
    <div class="chat-thread">

        <button type="button" class="back-btn" data-act="close-chat">${svgIcon('back')}</button>

/* ================= events ================= */
function bindEvents(){
  const on = (sel, ev, fn) => { const el = root.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  const onAll = (sel, ev, fn) => root.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));

  if (!state.session){
    on('[data-act="mode-login"]', 'click', () => { state.authMode='login'; state.authError=''; render(); });
    on('[data-act="mode-create"]', 'click', () => { state.authMode='create'; state.authError=''; render(); });

    on('#login-id', 'input', e => state.authForm.idCard = e.target.value);
    on('#login-password', 'input', e => state.authForm.password = e.target.value);
    on('[data-act="login"]', 'click', handleLogin);

    on('[data-act="role-student"]', 'click', () => { state.authForm.role='student'; state.authError=''; render(); });
    on('[data-act="role-admin"]', 'click', () => { state.authForm.role='admin'; state.authError=''; render(); });

    on('#create-id', 'input', e => { state.authForm.idCard = e.target.value; });
    on('#create-password', 'input', e => { state.authForm.password = e.target.value; });
    on('#create-name', 'input', e => { state.authForm.name = e.target.value; });
    on('#create-subject', 'input', e => { state.authForm.subject = e.target.value; });
    on('#create-admincode', 'input', e => { state.authForm.adminCode = e.target.value; });
    on('[data-act="pick-photo"]', 'click', () => root.querySelector('#create-photo-input').click());
    on('#create-photo-input', 'change', async e => {
      const file = e.target.files[0]; if (!file) return;
      state.authForm.photo = await resizeImage(file); // login se pehle koi session/uid nahi hota, isliye upload nahi ho sakta — turant preview ke liye base64 hi rakhte hain; account banate hi ye Storage par upload ho jaayegi (handleCreate mein)
      render();
    });
    on('[data-act="create"]', 'click', handleCreate);
    return;
  }

  on('[data-act="logout"]', 'click', async () => {
    if (state.timer.running) pauseTimer();
    if (state.stopwatch.running) pauseStopwatch();
    state.profileEdit=null; state.profileNameError=''; state.viewingProfile=null; state.chatWith=null; state.chatList=[]; state.searchQuery='';
    try { await auth.signOut(); } catch(e){}
  });
  on('[data-act="toggle-theme"]', 'click', toggleTheme);
  // Tools tab se bahar jaate waqt study timer/stopwatch ko background mein
  // chalte rehne dene ki zaroorat nahi — pause kar dete hain taaki har
  // second ki re-render dusre tabs mein waste na ho.
  const leaveTools = () => {
    if (state.tab === 'tools' && state.timer.running) pauseTimer();
    if (state.tab === 'tools' && state.stopwatch.running) pauseStopwatch();
  };
  on('[data-act="tab-home"]', 'click', () => { leaveTools(); state.tab='home'; state.viewingProfile=null; state.chatWith=null; render(); fetchFeed(); });
  on('[data-act="tab-search"]', 'click', () => { leaveTools(); state.tab='search'; state.viewingProfile=null; state.chatWith=null; render(); fetchProfiles(); });
  on('[data-act="tab-tools"]', 'click', () => { state.tab='tools'; state.viewingProfile=null; state.chatWith=null; render(); });
  on('[data-act="tab-chat"]', 'click', () => { leaveTools(); state.tab='chat'; state.viewingProfile=null; state.chatWith=null; render(); subscribeChatList(); });
  on('[data-act="tab-profile"]', 'click', () => { leaveTools(); state.tab='profile'; state.viewingProfile=null; state.chatWith=null; render(); });
  on('[data-act="tab-admin"]', 'click', () => { leaveTools(); state.tab='admin'; state.viewingProfile=null; state.chatWith=null; render(); fetchValidIds(); });

  if (state.chatWith){
    on('[data-act="close-chat"]', 'click', () => {
      if (unsubChatMsgs) { unsubChatMsgs(); unsubChatMsgs = null; }
      state.chatWith=null; state.chatMessages=[]; render(); subscribeChatList();
    });
    on('#chat-text-input', 'input', e => state.chatText = e.target.value);
